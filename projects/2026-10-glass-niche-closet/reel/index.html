<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<script src="assets/reel-kit.js"></script>
<link rel="stylesheet" href="assets/reel-kit.css" />
<!-- Glass niche closet v3 (13.10, redo): v2 (loved) kept 0-12 s; new ending = dive into the real niche close-up and back out.
  v2 beat sheet (0-12 s unchanged):  ~115 BPM (beat 0.52 s). One continuous camera on one stage.
  0.0–2.3   frame 0 = whole closet, niche dark; speed-ramp push (fast→slow)        "מקיר לקיר, / עד התקרה."
  2.6–3.7   signature: each niche cube lights on the beat (real lit pixels only), beat punch per cube; room brightens
  3.7–5.3   push to the whole lit niche, hold (no text)
  5.3–5.9   speed-ramp pull-out to the whole closet
  6.0–8.9   the 4 doors open in a wave around the lit niche (approved), hand-over to the real open photo at rest   "ובפנים, / כל סנטימטר עובד."
  9.0–10.4  beat snaps: pull-down rail → glass drawers (motion blur)
 10.5–11.9  doors close together, camera back to centre
 v3:
 11.8–13.5  same frame dissolves to the new styled photo (09, aligned + light-matched to 05)   "תוכנן / בשבילכם."
 13.6–14.3  zoom-through: speed-ramp push into the niche, blur peak, land on the real close-up (10, light-matched)
 14.0–16.0  hero: the whole lit niche, big and sharp, slow push (R12, 2 s, no text)
 16.0–17.75 ramp into the upper cubes, slow tilt down the lit shelves (LED profiles, oak)
 17.75–18.5 reverse zoom-through back out to the whole closet (blur peak 18.05)
 18.7–20.6  invitation                                                                   "רוצים כזה אצלכם? / דברו איתנו בוואטסאפ."
 20.8–23.8  end card: logo, ייעוץ והדמיה ללא עלות
 Stage = rectified photo x2 (1792x2400); scale 0.8 = x1.6 of the source, max 0.875 (x1.75). Text: one colour. -->
<style>
.w{width:1792px;height:2400px}
.wc{width:1932px;height:2576px}
/* front stage: doors from the lit closed photo, bays from the real open photo */
#sF{perspective:1620px;perspective-origin:896px 1400px}
.bay{position:absolute;top:456px;height:1748px;background-image:url(assets/open.png);background-size:1792px 2400px}
#bL{left:248px;width:500px;background-position:-248px -456px}
#bR{left:1076px;width:500px;background-position:-1076px -456px}
.bsh{position:absolute;top:456px;height:1748px;width:500px;background:rgba(28,20,13,.66)}
#hL{left:248px} #hR{left:1076px}
.cs{position:absolute;top:270px;height:2120px;background-image:url(assets/open.png);background-size:1792px 2400px;opacity:0}
#c1{left:104px;width:160px;background-position:-104px -270px}
#c2{left:700px;width:52px;background-position:-700px -270px}
#c4{left:1074px;width:40px;background-position:-1074px -270px}
#c5{left:1540px;width:190px;background-position:-1540px -270px}
.door{top:456px;height:1748px}
.door .face{background-image:url(assets/lit.png);background-size:1792px 2400px}
.door .back{background-image:url(assets/lit.png);background-size:1792px 2400px}
.door .edge{width:9px;background:linear-gradient(90deg,#8d8072 0,#8d8072 1px,#d9cdbd 2px,#c4b6a4)}
#d1{left:248px;width:254px;transform-origin:0 50%}   #d1 .face,#d1 .back{background-position:-248px -456px} #d1 .edge{left:100%} #d1 .shade{background:linear-gradient(90deg,rgba(60,44,30,1),rgba(60,44,30,.35))}
#d2{left:502px;width:246px;transform-origin:100% 50%} #d2 .face,#d2 .back{background-position:-502px -456px} #d2 .edge{left:0}    #d2 .shade{background:linear-gradient(270deg,rgba(60,44,30,1),rgba(60,44,30,.35))}
#d4{left:1076px;width:250px;transform-origin:0 50%}  #d4 .face,#d4 .back{background-position:-1076px -456px} #d4 .edge{left:100%} #d4 .shade{background:linear-gradient(90deg,rgba(60,44,30,1),rgba(60,44,30,.35))}
#d5{left:1326px;width:250px;transform-origin:100% 50%} #d5 .face,#d5 .back{background-position:-1326px -456px} #d5 .edge{left:0}  #d5 .shade{background:linear-gradient(270deg,rgba(60,44,30,1),rgba(60,44,30,.35))}
/* light-on stage: lit photo over the dark one, niche cut out; the niche fills shelf by shelf */

/* light-on overlays (dark photo on top of the lit stage); the niche goes dark→lit cube by cube */
#offAll{opacity:1;clip-path:path(evenodd,"M0 0H1792V2400H0Z M746 798H1078V1596H746Z")}
.cmp{position:absolute;left:746px;width:332px;background-image:url(assets/off.png);background-size:1792px 2400px}
#k3{top:1306px;height:290px;background-position:-746px -1306px}
#k2{top:1054px;height:252px;background-position:-746px -1054px}
#k1{top:798px;height:256px;background-position:-746px -798px}
/* logo tones on every card (her note 13.10): line 1 logo grey, line 2 logo wood; same scheme everywhere, no accent words */
.t{left:0;width:1080px;text-align:center;color:#57565b}
.t .ln + .ln{color:#8a6a43}
#t1{top:1330px;font-size:92px}
#t2{top:150px;font-size:84px}
#t3{top:332px;font-size:96px}
#t4{top:1330px;font-size:76px}
#end .l1{color:#efe6da}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="23.8" data-width="1080" data-height="1920">
  <div id="scene" class="clip" data-start="0" data-duration="23.8" data-track-index="0" style="position:absolute;inset:0">
    <div id="LS" class="lay"><div class="st w" id="sS"><img class="w" src="assets/styled2.png" alt="" /></div></div>
    <div id="LF" class="lay"><div class="st w" id="sF">
      <img class="w" src="assets/lit.png" alt="" />
      <div class="bay" id="bL"></div><div class="bay" id="bR"></div>
      <div class="bsh" id="hL"></div><div class="bsh" id="hR"></div>
      <div class="cs" id="c1"></div><div class="cs" id="c2"></div><div class="cs" id="c4"></div><div class="cs" id="c5"></div>
      <div class="door" id="d1"><div class="face"></div><div class="back"></div><div class="shade"></div><div class="edge"></div><div class="fs"></div></div>
      <div class="door" id="d2"><div class="face"></div><div class="back"></div><div class="shade"></div><div class="edge"></div><div class="fs"></div></div>
      <div class="door" id="d4"><div class="face"></div><div class="back"></div><div class="shade"></div><div class="edge"></div><div class="fs"></div></div>
      <div class="door" id="d5"><div class="face"></div><div class="back"></div><div class="shade"></div><div class="edge"></div><div class="fs"></div></div>
      <img class="w" id="offAll" src="assets/off.png" alt="" />
      <div class="cmp" id="k3"></div><div class="cmp" id="k2"></div><div class="cmp" id="k1"></div>
    </div></div>
    <div id="LC" class="lay"><div class="st wc" id="sC"><img class="wc" src="assets/close.png" alt="" /></div></div>
  </div>
  <div id="txt" class="clip" data-start="0" data-duration="23.8" data-track-index="1" style="position:absolute;inset:0">
    <div id="t1" class="t"><div class="ln"><span>מקיר</span> <span>לקיר,</span></div><div class="ln"><span>עד</span> <span>התקרה.</span></div></div>
    <div id="t2" class="t"><div class="ln"><span>ובפנים,</span></div><div class="ln"><span>כל</span> <span>סנטימטר</span> <span>עובד.</span></div></div>
    <div id="t3" class="t"><div class="ln"><span>תוכנן</span></div><div class="ln"><span>בשבילכם.</span></div></div>
    <div id="t4" class="t"><div class="ln"><span>רוצים</span> <span>כזה</span> <span>אצלכם?</span></div><div class="ln"><span>דברו</span> <span>איתנו</span> <span>בוואטסאפ.</span></div></div>
    <div id="end"><div id="endglow"></div><div id="endin"><img src="assets/logo_light.png" alt="אבן ועץ" /><div class="l1">ייעוץ והדמיה<br />ללא עלות.</div><div class="l2">נגרות בהתאמה אישית</div></div></div>
  </div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const K = RK.kit(tl);
gsap.set(["#LS", "#LC"], { opacity: 0 });
gsap.set("#LF", { transformOrigin: "540px 960px" });

// one camera for the whole front story: speed-ramp push, hold on the lit niche, speed-ramp pull-out, snaps, back to centre
K.path("#sF", [[0, 896, 1200, 0.80], [0.55, 900, 1188, 0.83], [2.3, 906, 1178, 0.858], [3.7, 912, 1188, 0.86], [5.3, 912, 1208, 0.875],
  [5.9, 902, 1203, 0.812], [8.9, 904, 1200, 0.83], [9.5, 1110, 1125, 0.87], [9.85, 1125, 1150, 0.875], [10.15, 700, 1270, 0.87],
  [10.5, 680, 1285, 0.875], [11.2, 905, 1205, 0.83], [12.1, 910, 1200, 0.85]]);
K.card("#t1", 0.15, 2.15);

// signature: each cube lights on the beat (the dark photo lifts cube by cube), room brightens with it; beat punch per cube
tl.to("#offAll", { opacity: 0, duration: 1.4, ease: "sine.inOut" }, 2.6);
[["#k3", 2.6], ["#k2", 3.12], ["#k1", 3.64]].forEach(([k, t]) => {
  tl.to(k, { opacity: 0, duration: 0.22, ease: "power2.out" }, t);
  tl.fromTo("#LF", { scale: 1 }, { scale: 1.022, duration: 0.09, ease: "power2.out", immediateRender: false }, t);
  tl.to("#LF", { scale: 1, duration: 0.38, ease: "power2.inOut" }, t + 0.09);
});

// doors open in a wave around the glowing niche (approved), soft hand-over to the real open photo at rest
// end angles solved (perspective 1620 @ x 896): the door's free edge lands exactly on the real open door's edge in photo 07
const open = (id, sign, at, dur, strip, ang = 90) => {
  tl.fromTo(id, { rotationY: 0 }, { rotationY: sign * ang, duration: dur, ease: "power2.inOut", immediateRender: false }, at);
  tl.fromTo(id + " .shade", { opacity: 0 }, { opacity: 0.26, duration: dur, ease: "power2.inOut", immediateRender: false }, at);
  tl.fromTo(id + " .fs", { opacity: 0 }, { opacity: 0.45, duration: dur, ease: "power2.inOut", immediateRender: false }, at);
  tl.to(id, { opacity: 0, duration: 0.18, ease: "sine.inOut" }, at + dur - 0.1);
  tl.to(strip, { opacity: 1, duration: 0.18, ease: "sine.inOut" }, at + dur - 0.1);
};
const close = (id, sign, at, dur, strip, ang = 90) => {
  tl.to(id, { opacity: 1, duration: 0.2, ease: "sine.inOut" }, at - 0.2);
  tl.to(strip, { opacity: 0, duration: 0.2, ease: "sine.inOut" }, at - 0.2);
  tl.fromTo(id, { rotationY: sign * ang }, { rotationY: 0, duration: dur, ease: "power2.in", immediateRender: false }, at);
  tl.to([id + " .shade", id + " .fs"], { opacity: 0, duration: dur, ease: "power2.in" }, at);
};
open("#d2", 1, 6.05, 1.4, "#c2", 85.7);  open("#d4", -1, 6.05, 1.4, "#c4", 89);
open("#d1", -1, 6.45, 1.45, "#c1", 94.6); open("#d5", 1, 6.45, 1.45, "#c5", 96);
tl.fromTo(["#hL", "#hR"], { opacity: 1 }, { opacity: 0, duration: 1.7, ease: "power1.inOut", immediateRender: false }, 6.15);
K.card("#t2", 7.85, 9.5);
// beat snaps between details: motion blur only while the camera snaps
[[9.85, 10.15]].forEach(([a, b]) => {
  tl.fromTo("#LF", { filter: "blur(0px)" }, { filter: "blur(7px)", duration: (b - a) / 2, ease: "power2.in", immediateRender: false }, a);
  tl.to("#LF", { filter: "blur(0px)", duration: (b - a) / 2, ease: "power2.out" }, a + (b - a) / 2);
});
// doors close together, like real hands (slight stagger), soft landing on the beat
close("#d2", 1, 10.75, 0.95, "#c2", 85.7); close("#d4", -1, 10.8, 0.92, "#c4", 89);
close("#d1", -1, 10.78, 0.97, "#c1", 94.6); close("#d5", 1, 10.83, 0.95, "#c5", 96);
tl.to(["#hL", "#hR"], { opacity: 1, duration: 0.9, ease: "power1.in" }, 10.8);

// same frame: the niche becomes lived-in (new styled photo, aligned + light-matched to the same pixels)
tl.set("#LS", { opacity: 1 }, 11.8);
tl.fromTo("#LF", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "sine.inOut", immediateRender: false }, 11.8);
// front niche frame centre (914,1192) in stage px; close-up niche is x2.79 bigger -> front scale 2.12 = close scale 0.76
K.path("#sS", [[11.8, 910, 1200, 0.85], [12.9, 911, 1198, 0.875], [13.6, 913, 1194, 0.96], [14.0, 914, 1192, 2.12],
  [18.05, 914, 1192, 2.12], [18.42, 912, 1196, 1.05], [18.95, 910, 1197, 0.91], [20.8, 906, 1194, 0.865]]);
K.card("#t3", 11.95, 13.0); // fully gone (~13.4) before the zoom-through starts (13.5)
// zoom-through in: blur peak at 14.0, short crossfade hidden in the blur
tl.fromTo("#LS", { filter: "blur(0px)" }, { filter: "blur(12px)", duration: 0.22, ease: "power2.in", immediateRender: false }, 13.78);
tl.fromTo("#LC", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "sine.inOut", immediateRender: false }, 13.93);
tl.fromTo("#LC", { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.24, ease: "power2.out", immediateRender: false }, 14.0);
// close-up camera: land still moving, hero hold on the whole niche (2 s), ramp into the upper cubes, slow tilt down, rush back out
K.path("#sC", [[13.93, 915, 1292, 0.745], [14.0, 915, 1290, 0.76], [14.3, 915, 1290, 0.80], [16.0, 915, 1290, 0.84],
  [16.6, 915, 1000, 1.22], [17.8, 915, 1580, 1.27], [18.05, 915, 1290, 0.76], [18.12, 915, 1292, 0.745]]);
// zoom-through out: blur peak at 18.05
tl.to("#LC", { filter: "blur(12px)", duration: 0.22, ease: "power2.in" }, 17.83);
tl.set("#LS", { filter: "blur(12px)" }, 17.95);
tl.to("#LC", { opacity: 0, duration: 0.14, ease: "sine.inOut" }, 17.98);
tl.to("#LS", { filter: "blur(0px)", duration: 0.24, ease: "power2.out" }, 18.05);
K.card("#t4", 18.7, 20.6);

K.endCard(20.8, 3.0);
K.done(23.8);
</script>
</body>
</html>
