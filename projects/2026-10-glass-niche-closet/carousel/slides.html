<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<!-- v4 (13.10, redo): typography option ג she chose: IBM Plex Sans Hebrew Regular, small, two lines charcoal + caramel-gold,
     right-aligned to the edge of the work (not centred), short thin gold rule under. Photos: originals (grade.py moved the
     material colour by dE>2, P15). Slide 2 = the new hi-res niche close-up, slide 4 = the new styled front. -->
<style>
@font-face{font-family:"Plex";src:url(plex-Regular.ttf);font-weight:400}
@font-face{font-family:"Plex";src:url(plex-Medium.ttf);font-weight:500}
:root{--ink:#2b2926;--gold:#9a6a32;--cream:#efe6da;--gold-l:#d8b878}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:#d9d0c6}
.full{position:absolute;inset:0;width:1080px;height:1350px}
.h{position:absolute;direction:rtl;text-align:right;font:400 64px/1.18 "Plex";color:var(--ink)}
.h span{display:block;color:var(--gold)}
.h i{display:block;width:90px;height:2px;background:var(--gold);margin:22px 0 0 auto}
.h.dk{color:var(--cream)} .h.dk span{color:var(--gold-l)} .h.dk i{background:var(--gold-l)}
.sub{display:block;margin-top:16px;font:400 30px/1.3 "Plex";color:var(--ink);letter-spacing:.01em}
.cta{position:absolute;direction:rtl;text-align:right;font:500 32px/1 "Plex";color:var(--gold);letter-spacing:.01em}
.cta:after{content:"";display:block;height:2px;margin-top:12px;background:var(--gold)}
.logo{position:absolute;right:30px;bottom:96px;width:104px}
.end{background:radial-gradient(110% 80% at 50% 45%,#3b2617 0%,#1f140c 75%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.end .glow{position:absolute;left:165px;top:300px;width:750px;height:750px;border-radius:50%;background:radial-gradient(circle,rgba(216,170,100,.32) 0%,rgba(216,170,100,.12) 40%,rgba(216,170,100,0) 70%)}
.end .lg{position:relative;width:340px}
.end .line{position:relative;direction:rtl;text-align:center;margin-top:64px;font:400 52px/1.2 "Plex";color:var(--cream);letter-spacing:.01em}
.end .rule{position:relative;width:90px;height:2px;background:var(--gold-l);margin-top:26px}
</style>
</head>
<body>
<section class="slide" id="s1">
  <img class="full" src="p1.png" alt="" />
  <div class="h" style="right:150px;top:92px">רוב הארונות<span>רק מסתירים.</span><i></i></div>
  <img class="logo" src="logo_alpha.png" alt="אבן ועץ" />
</section>
<section class="slide" id="s2">
  <img class="full" src="p2.png" alt="" />
  <div class="h dk" style="right:72px;top:100px">זה<span>גם מציג.</span><i></i></div>
</section>
<section class="slide" id="s3">
  <img class="full" src="p3.png" alt="" />
  <div class="h" style="right:134px;top:16px;font-size:56px">ומה שמוסתר,<span>מתוכנן ומוקפד.</span><i style="margin-top:14px"></i></div>
</section>
<section class="slide" id="s4">
  <img class="full" src="p4.png" alt="" />
  <div class="h" style="right:150px;top:8px;font-size:56px">מה אתם רוצים<span>לראות?</span><i style="margin-top:14px"></i><em class="sub" style="font-style:normal;margin-top:12px">תכנון אישי מתחיל בשאלה אחת</em><em class="sub" style="font-style:normal;margin-top:6px;font-weight:500;color:#6b4519">דברו איתנו בוואטסאפ</em></div>
  <img class="logo" src="logo_alpha.png" alt="אבן ועץ" />
</section>
<section class="slide end" id="s5">
  <div class="glow"></div>
  <img class="lg" src="logo_light.png" alt="אבן ועץ" />
  <div class="rule"></div>
  <div class="line">תכנון אישי לכל חלל</div>
</section>
</body>
</html>
