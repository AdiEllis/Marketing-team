<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<!-- v2 (13.10, "לא נראה מספיק מקצועי... מצועצע וai"): שפה אדריכלית שקטה בהשראת סט 2.
     כותרת: Karantina Light (צרה, דקה), פחם, גודל אחד בכל השקפים; שורת משנה: Heebo 300 קטנה עם ריווח אותיות.
     בלי צבע מבטא, בלי קווים ובלי משקלים כבדים. כל כותרת מיושרת לקו אמיתי של העבודה. -->
<style>
@font-face{font-family:"K";src:url(Karantina-300-hebrew.woff2);font-weight:300}
@font-face{font-family:"Heebo";src:url(heebo.ttf);font-weight:100 900}
:root{--ink:#2b2520;--sub:#5b4f45}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:#d9d0c6}
.full{position:absolute;inset:0;width:1080px;height:1350px}
.h{position:absolute;direction:rtl;text-align:right;color:var(--ink);white-space:nowrap}
.h .t{display:block;font:300 124px/.92 "K";letter-spacing:.005em}
.h .s{display:block;font:300 36px/1.3 "Heebo";letter-spacing:.06em;color:var(--sub);margin-bottom:14px}
.end{background:radial-gradient(110% 80% at 50% 45%,#3b2617 0%,#1f140c 75%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.end .glow{position:absolute;left:165px;top:300px;width:750px;height:750px;border-radius:50%;background:radial-gradient(circle,rgba(216,170,100,.32) 0%,rgba(216,170,100,.12) 40%,rgba(216,170,100,0) 70%)}
.end .logo{position:relative;width:340px}
.end .line{position:relative;direction:rtl;text-align:center;margin-top:72px;font:300 92px/1 "K";color:#eadccb;letter-spacing:.01em}
</style>
</head>
<body>
<section class="slide" id="s1">
  <img class="full" src="p1.png" alt="" />
  <div class="h" style="top:96px;right:130px"><span class="t">רוב הארונות רק מסתירים.</span></div>
</section>
<section class="slide" id="s2">
  <img class="full" src="p2.png" alt="" />
  <div class="h" style="top:150px;left:369px;width:357px;text-align:center"><span class="t">זה גם מציג.</span></div>
</section>
<section class="slide" id="s3">
  <img class="full" src="p3.png" alt="" />
  <div class="h" style="top:26px;right:56px"><span class="s">ומה שמוסתר,</span><span class="t" style="font-size:104px">מתוכנן באותה הקפדה.</span></div>
</section>
<section class="slide" id="s4">
  <img class="full" src="p4.png" alt="" />
</section>
<section class="slide" id="s5">
  <img class="full" src="p5.png" alt="" />
  <div class="h" id="q" style="bottom:96px;right:300px;font-size:0"><span class="s">תכנון אישי מתחיל בשאלה אחת:</span><span class="t" style="font-size:116px">מה אתם רוצים<br />לראות?</span></div>
</section>
<section class="slide end" id="s6">
  <div class="glow"></div>
  <img class="logo" src="logo_light.png" alt="אבן ועץ" />
  <div class="line">נתכנן את שלכם.</div>
</section>
</body>
</html>
