<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<!-- Brand post v1 (general, not one project). THE POST SHOWS THAT: every home gets its own planning — a kids' room, a living
     room, a TV wall each solved differently, at the same finish — so the natural next step is a free consultation + visualisation.
     Argument: S1 hook (the line, on the warm wall) → S2/S3 proof: two different homes, each with one quiet label naming what was
     planned for THAT home → S4 the reason to contact: "ומה נתכנן אצלכם?" + free consultation + logo.
     Whole works in every slide (sources already 4:5; kids = her AI room extension, closet pixels real). No bands, no scrims. -->
<style>
@font-face{font-family:"Heebo";src:url(../reel/assets/heebo.ttf);font-weight:100 900}
@font-face{font-family:"Plex";src:url(plex-Medium.ttf);font-weight:500}
@font-face{font-family:"Plex";src:url(plex-SemiBold.ttf);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden}
.full{position:absolute;inset:0;width:1080px;height:1350px}
.h{position:absolute;direction:rtl;text-align:right;font:850 88px/1.04 "Heebo";letter-spacing:-.015em}
.h em{display:block;font-style:normal}
#s1 .h{right:56px;bottom:26px;font-size:70px;color:#1f1813}
#s1 .h em{color:#8a5a26}
#s1 .mark{position:absolute;right:66px;top:46px;width:70px}
.lab{position:absolute;direction:rtl;display:flex;align-items:center;gap:18px;font:600 31px/1.2 "Plex";color:#2b211a}
.lab i{display:block;width:46px;height:2px;background:#a8763e}
.lab b{font-weight:600;color:#8a5a26}
#s2 .lab{right:70px;bottom:24px}
#s3 .lab{right:70px;bottom:56px}
#s4 .blk{position:absolute;right:150px;top:178px;width:470px;direction:rtl}
#s4 .h{position:static;font-size:72px;color:#1f1813}
#s4 .h em{color:#8a5a26}
#s4 .sub{margin-top:18px;direction:rtl;font:500 29px/1.35 "Plex";color:#2b211a}
#s4 .sign{position:absolute;left:46px;bottom:40px;width:70px}
</style>
</head>
<body>
<section class="slide" id="s1">
  <img class="full" src="p_warm.png" alt="" />
  <div class="h">כל בית שונה.<em>ככה גם התכנון.</em></div>
  <img class="mark" src="logo_alpha.png" alt="אבן ועץ" />
</section>
<section class="slide" id="s2">
  <img class="full" src="p_kids.png" alt="" />
  <div class="lab"><i></i><span><b>חדר ילדים</b> · נישה מוארת ומדפים</span></div>
</section>
<section class="slide" id="s3">
  <img class="full" src="p_open.png" alt="" />
  <div class="lab"><i></i><span><b>סלון</b> · קיר שמסתיר ארון ומגירה</span></div>
</section>
<section class="slide" id="s4">
  <img class="full" src="p_detail.png" alt="" />
  <div class="blk"><div class="h">ומה נתכנן<em>אצלכם?</em></div>
  <div class="sub">פגישת ייעוץ והדמיה ללא עלות.<br>דברו איתנו.</div></div>
  <img class="sign" src="logo_alpha.png" alt="אבן ועץ" />
</section>
</body>
</html>
