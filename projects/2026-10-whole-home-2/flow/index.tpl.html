<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<script src="assets/reel-kit.js"></script>
<link rel="stylesheet" href="assets/reel-kit.css" />
<!-- Whole home 2 — "מהסלון / ועד הארון האחרון." Approved card 14.10 (her change: no "צוות אחד").
     Beat grid 110 bpm (B = 0.5455 s). Stage units = photo pixels 1122x1402 (mauve 949x1402); images are AI x2.
     T  0–2.3    frame 0 = the TV wall, whole height, already pushing; the lit shelving unit WHOLE in frame (R12),
                 its real light breathing. Hook on the calm floor (right half, clear of the console).
     DISS 2.0    motion dissolve into the FLIP RUN (signature): one continuous push while the home's wardrobes swap under
                 it on the beat, each framed at the same height and centre: mauve 2.18 · grey 2.73 · oak 3.27 · white 3.82
                 (micro blur on each beat cut, the push never stops)
     W  3.82–6.9 the run STOPS on the white wardrobe: its two doors open (calibrated rig from whole-home 11.10, ported
                 x1.217; hinge-side ease like a hand), the camera goes in to the real pull-down rail. "גם הגובה / מנוצל."
     WHIP 6.9    the reel's one whip → mauve: tilt DOWN along the open oak column (R11 detail through camera motion)
     DISS 8.9    → grey: push to the split round handle; "נמדד / לקיר הזה." on the plain upper doors
     DISS 10.9   → oak: glide along the wall-to-wall wardrobe into the cladding and floating vanity (no text)
     DISS 13.0   → TV wall: pull-back from the lit unit to the whole wall; "ייעוץ והדמיה / ללא עלות." → "דברו איתנו / בוואטסאפ"
     END 17.4–20 living end card -->
<style>
.ph{position:absolute;left:0;top:0;width:1122px;height:1402px}
.st > img.ph.m{width:949px}
.st > img{width:auto;height:auto}
.st > img.ph{width:1122px;height:1402px}
.st > img.ph.m{width:949px;height:1402px}
.t{left:0;width:1080px;text-align:center;color:#57565b}
.t .ln + .ln{color:#8a6a43}
#t1,#t4,#t5{left:auto;right:110px;width:auto;text-align:right;top:1372px;font-size:70px}
#t2{top:1170px;font-size:92px;left:-70px}
#t3{top:330px;font-size:92px;left:110px;width:400px}
#end .l1{color:#efe6da;font-size:70px}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
  <div id="scene" class="clip" data-start="0" data-duration="20" data-track-index="0" style="position:absolute;inset:0">
    <!-- later stages first (underneath), frame-0 stage last (on top) -->
    <div id="LT2" class="lay"><div class="st" id="sT2"><img class="ph" src="assets/tv.png" alt="" /><img class="ph bl" id="bT2" src="assets/tv_bloom.jpg" alt="" /></div></div>
    <div id="LO2" class="lay"><div class="st" id="sO2"><img class="ph" src="assets/oak.png" alt="" /></div></div>
    <div id="LG2" class="lay"><div class="st" id="sG2"><img class="ph" src="assets/grey.png" alt="" /></div></div>
    <div id="LM2" class="lay"><div class="st" id="sM2"><img class="ph m" src="assets/mauve.png" alt="" /></div></div>
    <div id="LW" class="lay"><div class="st" id="sW" data-rig="white"></div></div>
    <div id="LO" class="lay"><div class="st" id="sO"><img class="ph" src="assets/oak.png" alt="" /></div></div>
    <div id="LG" class="lay"><div class="st" id="sG"><img class="ph" src="assets/grey.png" alt="" /></div></div>
    <div id="LM" class="lay"><div class="st" id="sM"><img class="ph m" src="assets/mauve.png" alt="" /></div></div>
    <div id="LT" class="lay"><div class="st" id="sT"><img class="ph" src="assets/tv.png" alt="" /><img class="ph bl" id="bT" src="assets/tv_bloom.jpg" alt="" /></div></div>
  </div>
  <div id="txt" class="clip" data-start="0" data-duration="20" data-track-index="1" style="position:absolute;inset:0">
    <div id="t1" class="t"><div class="ln"><span>מהסלון</span></div><div class="ln"><span>ועד</span> <span>הארון</span> <span>האחרון.</span></div></div>
    <div id="t2" class="t"><div class="ln"><span>גם</span> <span>הגובה</span></div><div class="ln"><span>מנוצל.</span></div></div>
    <div id="t3" class="t"><div class="ln"><span>נמדד</span></div><div class="ln"><span>לקיר</span> <span>הזה.</span></div></div>
    <div id="t4" class="t"><div class="ln"><span>ייעוץ</span> <span>והדמיה</span></div><div class="ln"><span>ללא</span> <span>עלות.</span></div></div>
    <div id="t5" class="t"><div class="ln"><span>דברו</span> <span>איתנו</span></div><div class="ln"><span>בוואטסאפ</span></div></div>
    <div id="end"><div id="endglow"></div><div id="endin"><img src="assets/logo_light.png" alt="אבן ועץ" /><div class="l1">מתכננים<br /><em>את כל הבית.</em></div><div class="l2">נגרות בהתאמה אישית</div></div></div>
  </div>
</div>
<script>
const RIGS = { white: __WHITE__ };
const $ = id => document.getElementById(id);
const HS = 2;   // texture density of the hq images vs the 1122 stage units

function buildRig(name) {
  const R = RIGS[name], st = document.querySelector(`[data-rig="${name}"]`), D = Object.keys(R.doors);
  const add = (tag, id, attrs, style) => { const e = document.createElement(tag); e.id = id; Object.assign(e, attrs); if (style) e.style.cssText = style; st.appendChild(e); return e; };
  add("img", name + "_closed", { src: `assets/${name}/closed.png`, className: "ph" });
  add("img", name + "_in", { src: `assets/${name}/interior.png`, className: "ph" }, "opacity:0");
  D.forEach(n => add("div", `${name}_sh_${n}`, { className: "q" }, "width:100px;height:100px;background:#0d0a08;opacity:0;filter:blur(10px)"));
  D.forEach(n => add("div", `${name}_cs_${n}`, { className: "q" }, "width:100px;height:100px;background:#3a2f26;opacity:0;filter:blur(7px)"));
  D.forEach(n => {
    const d = R.doors[n];
    add("div", `${name}_ed_${n}`, { className: "q" }, "width:10px;height:100px;background:linear-gradient(90deg,#c9c6c1,#e9e6e1);opacity:0");
    add("img", `${name}_f_${n}`, { src: `assets/${name}/door_${n}_front.png`, className: "q" });
    add("img", `${name}_k_${n}`, { src: `assets/${name}/door_${n}_back.png`, className: "q" }, "opacity:0");
    add("div", `${name}_s_${n}`, { className: "q" }, `width:${d.tw}px;height:${d.th}px;background:#140e0a;opacity:0`);
  });
}
// calibrated rig (whole-home 11.10, approved): P[1] is the hinge edge; doors swing toward the camera
function rig(name) {
  const R = RIGS[name], Kf = R.K[0][0], Kcx = R.K[0][2], Kcy = R.K[1][2];
  const proj = P => { const c = [0, 1, 2].map(i => R.O[i] + P[0] * R.rx[i] + P[1] * R.ry[i] + P[2] * R.rz[i]);
    return [Kf * c[0] / c[2] + Kcx, Kf * c[1] / c[2] + Kcy]; };
  const area = q => { let a = 0; for (let i = 0; i < 4; i++) { const p = q[i], r = q[(i + 1) % 4]; a += p[0] * r[1] - r[0] * p[1]; } return a; };
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const ST = {}; const D = Object.keys(R.doors); D.forEach(n => (ST[n] = 0));
  function door(n, phi) {
    const d = R.doors[n], P = d.P, hx = P[1][0], T = d.T;
    const Rr = P.map(p => { const dx = p[0] - hx; return [hx + dx * Math.cos(phi), p[1], Math.abs(dx) * Math.sin(phi)]; });
    const q = Rr.map(proj), q0 = P.map(proj);
    const f = $(`${name}_f_${n}`), k = $(`${name}_k_${n}`), s = $(`${name}_s_${n}`), e = $(`${name}_ed_${n}`), sh = $(`${name}_sh_${n}`);
    const light = Math.sin(Math.min(phi, 1.45));
    if (Math.sign(area(q)) === Math.sign(area(q0))) {
      RK.put(f, d.tw, d.th, q); f.style.opacity = 1; k.style.opacity = 0;
      RK.put(s, d.tw, d.th, q); s.style.opacity = 0.2 * light;
    } else {
      const qb = [q[1], q[0], q[3], q[2]];
      RK.put(k, d.tw, d.th, qb); k.style.opacity = 1; f.style.opacity = 0;
      RK.put(s, d.tw, d.th, qb); s.style.opacity = 0.1;
    }
    let nrm = cross(sub(Rr[1], Rr[0]), sub(Rr[3], Rr[0])); const n0 = cross(sub(P[1], P[0]), sub(P[3], P[0]));
    const sg = Math.sign(n0[2]) || 1, L = Math.hypot(...nrm); nrm = nrm.map(v => v * sg / L);
    const bk = [-T * nrm[0], -T * nrm[1], -T * nrm[2]], a = Rr[0], b = Rr[3];
    const eq = [proj(a), proj([a[0] + bk[0], a[1] + bk[1], a[2] + bk[2]]), proj([b[0] + bk[0], b[1] + bk[1], b[2] + bk[2]]), proj(b)];
    const ea = Math.abs(area(eq)), eh = Math.hypot(eq[3][0] - eq[0][0], eq[3][1] - eq[0][1]);
    if (phi > 0.03 && ea > 5 * eh) { RK.put(e, 10, 100, eq); e.style.opacity = 1; } else e.style.opacity = 0;
    const cs = $(`${name}_cs_${n}`), fb = q[3], hb = q[2];
    RK.put(cs, 100, 100, [[fb[0], fb[1] - 4], [hb[0], hb[1] - 4], [hb[0], hb[1] + 10], [fb[0], fb[1] + 18]]);
    cs.style.opacity = phi > 0.05 ? 0.38 * Math.sin(Math.min(phi, 1.5)) : 0;
    RK.put(sh, 100, 100, q0); sh.style.opacity = phi < 0.004 ? 0 : 0.32 * Math.max(0, 1 - phi / 0.9);
  }
  const upd = () => { D.forEach(n => door(n, ST[n])); $(`${name}_in`).style.opacity = D.some(n => ST[n] > 0.004) ? 1 : 0; };
  upd();
  const open = (n, at, dur = 1.35) => {
    const to = R.doors[n].open * Math.PI / 180, k = 0.12, ramp = 0.18;
    tl.to(ST, { [n]: to * k, duration: ramp, ease: "power1.in", onUpdate: upd }, at);
    tl.to(ST, { [n]: to, duration: dur, ease: "power2.out", onUpdate: upd }, at + ramp);
  };
  return { open, upd };
}

buildRig("white");
const tl = gsap.timeline({ paused: true });
const K = RK.kit(tl);
const B = 60 / 110;
gsap.set(["#LM", "#LG", "#LO", "#LW", "#LM2", "#LG2", "#LO2", "#LT2"], { opacity: 0 });

// cover-safe view: clamp the centre so the photo always fills 1080x1920
const fit = (w, h, cx, cy, s) => [Math.min(Math.max(cx, 540 / s), w - 540 / s), Math.min(Math.max(cy, 960 / s), h - 960 / s), s];
const P = (el, w, h, keys) => K.path(el, keys.map(([t, cx, cy, s]) => [t, ...fit(w, h, cx, cy, Math.max(s, 1920 / h))]));

// T 0–2.3: frame 0, whole wall height, pushing toward the lit unit (x 760–960, y 260–800 stays whole)
P("#sT", 1122, 1402, [[0, 690, 705, 1.37], [1.2, 722, 718, 1.44], [2.35, 752, 735, 1.53]]);
K.breathe("#bT", [[0, 0.15], [1.2, 0.55], [2.3, 0.3]]);
K.card("#t1", 0.12, 1.8);

// FLIP RUN 2.0–3.82: one continuous push; each wardrobe at the same on-screen height (Hs) and centre
const Hs = t => 1640 + (t - 2.0) * 70;           // closet height on screen grows while the run lasts
const flip = (el, w, h, cx, mid, hc, t0, t1, extra = []) => P(el, w, h, [[t0, cx, mid, Hs(t0) / hc], [(t0 + t1) / 2, cx, mid, Hs((t0 + t1) / 2) / hc], [t1, cx, mid, Hs(t1) / hc], ...extra]);
K.dissolve("#LT", "#LM", 2.0, 0.3);
flip("#sM", 949, 1402, 460, 648, 1185, 2.0, 5 * B + 0.1);
const beat = (a, b, t) => { K.blurOut(a, t, 7, 0.08); K.swap(a, b, t); K.blurIn(b, t, 7, 0.12); };
beat("#LM", "#LG", 5 * B);
flip("#sG", 1122, 1402, 595, 650, 1150, 5 * B - 0.1, 6 * B + 0.1);
beat("#LG", "#LO", 6 * B);
flip("#sO", 1122, 1402, 440, 705, 1000, 6 * B - 0.1, 7 * B + 0.1);
beat("#LO", "#LW", 7 * B);

// W 3.82–6.9: the run decelerates and stops on the white wardrobe; the two doors open; in to the pull-down rail
const WH = rig("white");
P("#sW", 1122, 1402, [[7 * B - 0.1, 540, 640, Hs(7 * B - 0.1) / 1200], [4.3, 520, 640, 1.47], [5.0, 495, 630, 1.50], [5.8, 475, 612, 1.56], [6.9, 465, 600, 1.62]]);
WH.open("dl", 4.12); WH.open("dr", 4.28);
K.card("#t2", 5.45, 6.3);   // fully gone before the whip blur starts (gate 14.10)

// WHIP 6.9 → mauve: tilt down along the open oak column
K.blurOut("#LW", 6.9, 16, 0.22);
K.swap("#LW", "#LM2", 6.9);
K.blurIn("#LM2", 6.9, 16, 0.3);
P("#sM2", 949, 1402, [[6.9, 455, 470, 1.75], [7.9, 455, 640, 1.75], [9.3, 455, 840, 1.72]]);

// DISS 8.9 → grey: push to the split round handle (638,744)
K.dissolve("#LM2", "#LG2", 8.9, 0.36);
P("#sG2", 1122, 1402, [[8.9, 600, 680, 1.45], [9.9, 612, 692, 1.55], [11.2, 626, 705, 1.70]]);
K.card("#t3", 9.2, 10.6);

// DISS 10.9 → oak: glide along the wall-to-wall wardrobe into the cladding and the floating vanity
K.dissolve("#LG2", "#LO2", 10.9, 0.36);
P("#sO2", 1122, 1402, [[10.9, 380, 700, 1.48], [12.0, 560, 702, 1.48], [13.3, 745, 705, 1.50]]);

// DISS 13.0 → TV wall: pull back from the lit unit to the whole wall; two invitation cards on the floor
K.dissolve("#LO2", "#LT2", 13.0, 0.4);
P("#sT2", 1122, 1402, [[13.0, 790, 760, 1.58], [14.6, 760, 735, 1.48], [17.6, 640, 705, 1.37]]);   // ends wider-left than frame 0 (no repeat of frame 0)
K.breathe("#bT2", [[13.0, 0.5], [14.2, 0.2], [15.6, 0.5], [17.4, 0.3]]);
K.card("#t4", 13.6, 15.1);
K.card("#t5", 15.45, 17.1);
K.endCard(17.4, 2.6);
K.done(20);
</script>
</body>
</html>
