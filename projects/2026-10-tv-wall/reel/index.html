<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<!-- Latte/walnut reel v3 (flow 2, approved plan "קו אור"): bento of 3 lit details -> a thin warm LED line sweeps
     and reveals each next shot (the wall's own LED language), whip to the open view, zoom out, end card. -->
<style>
@font-face{font-family:"Heebo";src:url(assets/heebo.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1c1816}
#root{width:100%;height:100%;position:relative;overflow:hidden;background:#1c1816}
.lay{position:absolute;inset:0;overflow:hidden}
.st{position:absolute;left:0;top:0;width:1178px}
.st img{display:block;width:1178px}
.cell{position:absolute;left:0;width:1080px;height:640px;overflow:hidden}
#c1{top:0}#c2{top:640px}#c3{top:1280px}
.gap{position:absolute;left:0;width:1080px;height:6px;background:#1c1816}
.line{position:absolute;left:-40px;width:1160px;height:5px;background:#ffe2ae;box-shadow:0 0 18px 6px rgba(255,200,120,.75),0 0 60px 18px rgba(255,180,90,.35);border-radius:3px;opacity:0}
#topshade{position:absolute;left:0;right:0;top:0;height:620px;background:linear-gradient(180deg,rgba(18,14,12,.6),rgba(18,14,12,0));opacity:0}
.t{position:absolute;direction:rtl;text-align:right;right:70px;left:70px;font-family:"Heebo";font-weight:850;line-height:1.04;letter-spacing:-.01em}
.t .ln{display:block;overflow:hidden;padding:0 4px 12px}
.t span{display:inline-block}
.lite{color:#fff;text-shadow:0 2px 22px rgba(0,0,0,.4)}
.lite em{font-style:normal;color:#ffd99a}
#end{position:absolute;inset:0;background:radial-gradient(110% 80% at 50% 45%,#3b2617 0%,#1f140c 75%);opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;direction:rtl}
#end img{width:290px}
#end .l1{margin-top:56px;font-family:"Heebo";font-weight:800;font-size:58px;color:#fff;text-align:center}
#end .l2{margin-top:16px;font-family:"Heebo";font-weight:500;font-size:44px;color:#d8b878;text-align:center}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">

  <div id="scene" class="clip" data-start="0" data-duration="16" data-track-index="0" style="position:absolute;inset:0">
    <!-- shots, bottom to top; each next shot is revealed by the LED line (clip-path from the top) -->
    <div id="L1" class="lay"><div class="st" id="s1"><img src="assets/front_clean.png" alt="" /></div></div>
    <div id="L2" class="lay"><div class="st" id="s2"><img src="assets/wide_clean.png" alt="" /></div></div>
    <div id="L3" class="lay"><div class="st" id="s3"><img src="assets/front_clean.png" alt="" /></div></div>
    <div id="L4" class="lay"><div class="st" id="s4"><img src="assets/open_clean.png" alt="" /></div></div>
    <div id="L5" class="lay"><div class="st" id="s5"><img src="assets/wide_clean.png" alt="" /></div></div>
    <div id="L6" class="lay"><div class="st" id="s6"><img src="assets/front_clean.png" alt="" /></div></div>
    <!-- bento: three lit details (frame 0) -->
    <div id="bento" class="lay">
      <div class="cell" id="c1"><div class="st" id="k1"><img src="assets/front_clean.png" alt="" /></div></div>
      <div class="cell" id="c2"><div class="st" id="k2"><img src="assets/wide_clean.png" alt="" /></div></div>
      <div class="cell" id="c3"><div class="st" id="k3"><img src="assets/wide_clean.png" alt="" /></div></div>
      <div class="gap" style="top:637px"></div><div class="gap" style="top:1277px"></div>
    </div>
    <div id="topshade"></div>
    <div id="line" class="line"></div>
  </div>

  <div id="txt" class="clip" data-start="0" data-duration="16" data-track-index="1" style="position:absolute;inset:0">
    <div id="t1" class="t lite" style="top:250px;right:56px;left:auto;width:640px;font-size:80px;white-space:nowrap"><div class="ln"><span>מה</span> <span>שאוהבים</span> <span>—</span></div><div class="ln"><span><em>בחוץ.</em></span></div></div>
    <div id="t2" class="t lite" style="top:1330px;font-size:96px;white-space:nowrap"><div class="ln"><span>מה</span> <span>שצריך</span> <span>—</span></div><div class="ln"><span><em>בפנים.</em></span></div></div>
  </div>

  <div id="endwrap" class="clip" data-start="0" data-duration="16" data-track-index="2" style="position:absolute;inset:0">
    <div id="end"><img src="assets/logo_light.png" alt="אבן ועץ" /><div class="l1">קיר טלוויזיה בהתאמה אישית.</div><div class="l2">לאטה מט ואגוז מוסקט.</div></div>
  </div>
</div>

<script>
const tl = gsap.timeline({ paused: true });
// views keep Instagram leftovers (blurred bottom corners) out of frame; upscale <= ~1.75x
const H = { F: 1462, W: 1473, O: 1462 };
const view = (k, cx, cy, z) => { const s = (1920 / H[k]) * z; return { scale: s, x: 540 - cx * s, y: 960 - cy * s }; };
const cellv = (k, cx, cy, s) => ({ scale: s, x: 540 - cx * s, y: 320 - cy * s });   // inside a 1080x640 cell
gsap.set(".st", { transformOrigin: "0 0" });
const card = (sel, at, out) => {
  tl.fromTo(sel + " span", { yPercent: 110 }, { yPercent: 0, duration: 0.45, stagger: 0.07, ease: "power4.out" }, at);
  tl.to(sel + " span", { yPercent: -110, duration: 0.3, stagger: 0.04, ease: "power3.in" }, out);
};
// the LED line reveals layer `id` from the top down
const sweep = (id, at, dur = 0.55) => {
  tl.set(id, { clipPath: "inset(0 0 100% 0)", opacity: 1 }, at);
  tl.fromTo(id, { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: dur, ease: "power2.inOut", immediateRender: false }, at);
  tl.fromTo("#line", { y: -10, opacity: 1 }, { y: 1925, duration: dur, ease: "power2.inOut", immediateRender: false }, at);
  tl.set("#line", { opacity: 0 }, at + dur);
};
["#L2", "#L3", "#L4", "#L5", "#L6"].forEach(id => gsap.set(id, { opacity: 0 }));

// B1 0–1.3  bento: three lit details slide in (frame 0 already moving)
gsap.set("#k1", cellv("F", 640, 600, 1.5));
gsap.set("#k2", cellv("W", 350, 520, 1.55));
gsap.set("#k3", cellv("W", 660, 1190, 1.5));
tl.fromTo("#c1", { x: 260 }, { x: 0, duration: 0.7, ease: "expo.out" }, 0);
tl.fromTo("#c2", { x: -260 }, { x: 0, duration: 0.7, ease: "expo.out" }, 0.1);
tl.fromTo("#c3", { x: 260 }, { x: 0, duration: 0.7, ease: "expo.out" }, 0.2);
// B2 1.3  LED line reveals the whole wall (front)
tl.set("#L1", { clipPath: "inset(0 0 100% 0)" }, 0);
tl.set("#s1", view("F", 645, 731, 1.06), 0);
tl.fromTo("#L1", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.55, ease: "power2.inOut", immediateRender: false }, 1.3);
tl.fromTo("#line", { y: -10, opacity: 1 }, { y: 1925, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 1.3);
tl.set("#line", { opacity: 0 }, 1.85);
tl.set("#bento", { opacity: 0 }, 1.85);
tl.to("#s1", { ...view("F", 645, 720, 1.12), duration: 1.1, ease: "sine.out" }, 1.85);

// B3 2.91  line -> left niche, tilt down
tl.set("#s2", view("W", 330, 560, 1.35), 0);
sweep("#L2", 2.91);
tl.to("#s2", { ...view("W", 330, 610, 1.4), duration: 2.0, ease: "sine.inOut" }, 3.2);
card("#t1", 3.2, 4.8);

// B4 5.05  line -> walnut frame with LED strips, lateral glide
tl.set("#s3", view("F", 700, 600, 1.3), 0);
sweep("#L3", 5.05);
tl.to("#s3", { ...view("F", 545, 610, 1.32), duration: 1.6, ease: "sine.inOut" }, 5.1);

// B5 6.65  whip to the open view, push
tl.set("#s4", view("O", 640, 700, 1.1), 0);
tl.to("#L3", { x: 600, filter: "blur(16px)", duration: 0.24, ease: "power3.in" }, 6.65);
tl.set("#L4", { opacity: 1, x: -600 }, 6.89);
tl.set("#L3", { opacity: 0 }, 6.89);
tl.fromTo("#L4", { x: -600, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out", immediateRender: false }, 6.89);
tl.to("#s4", { ...view("O", 640, 680, 1.2), duration: 2.6, ease: "sine.out" }, 7.0);
card("#t2", 7.3, 9.4);

// B6 9.87  line -> floating base and the light on the floor, low glide
tl.set("#s5", view("W", 640, 930, 1.4), 0);
sweep("#L5", 9.87);
tl.to("#s5", { ...view("W", 740, 920, 1.42), duration: 1.3, ease: "sine.inOut" }, 9.95);

// B7 11.2–12.55  zoom out to the whole wall
tl.set("#s6", view("F", 620, 640, 1.35), 0);
tl.fromTo("#L6", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, 11.2);
tl.fromTo("#s6", view("F", 620, 640, 1.35), { ...view("F", 645, 731, 1.06), duration: 1.3, ease: "power3.out", immediateRender: false }, 11.2);

// B8 12.55–16  end card
tl.fromTo("#end", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut", immediateRender: false }, 12.55);
tl.fromTo("#end img", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 12.75);
tl.fromTo("#end .l1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, immediateRender: false }, 13.05);
tl.fromTo("#end .l2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, immediateRender: false }, 13.3);

window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body>
</html>
