<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<!-- Latte/walnut post v3 (after "the darkening is ugly and hides the product"): real photos only, zero overlays.
     Text sits on calm real surfaces in colours sampled from the photo (cream on walnut, espresso on ceiling/latte).
     S1 closed wall, the punch line sits on the quiet fronts -> S2 swipe: the whole wall open, no text -> S3 the angled view: lit niche and slatted cladding + CTA. -->
<style>
@font-face{font-family:"Heebo";src:url(heebo.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;font-family:"Heebo"}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden}
.full{position:absolute;inset:0;width:1080px;height:1350px}
.rtl{direction:rtl;text-align:right}

#s1 .cap{position:absolute;right:60px;bottom:96px;font:700 40px "Heebo";color:#f1e6d6;direction:rtl;letter-spacing:.01em}
#s1 .cap i{display:inline-block;width:42px;height:2px;background:#d8b878;vertical-align:middle;margin-left:14px}
#s1 .logo{position:absolute;left:44px;bottom:22px;width:112px}

#s1 .h{position:absolute;right:64px;top:262px;font:850 68px/1.1 "Heebo";letter-spacing:-.01em;color:#24170f;direction:rtl}
#s1 .h em{font-style:normal;color:#4a2e12}

#s3 .cta{position:absolute;right:80px;top:300px;font:800 56px/1.12 "Heebo";color:#2a1c13;direction:rtl}
#s3 .cta em{font-style:normal;font-weight:600;font-size:46px;color:#4a2e12}
#s3 .logo{position:absolute;right:120px;bottom:40px;width:118px}
</style>
</head>
<body>
<section class="slide" id="s1">
  <img class="full" src="p_front.png" alt="" />
  <div class="h">מאחורי החזיתות,<br /><em>עוד קיר של אחסון.</em></div>
  <div class="cap"><i></i>אגוז מוסקט, לאטה מט ותאורה בין המדפים</div>
  <img class="logo" src="logo_light.png" alt="אבן ועץ" />
</section>
<section class="slide" id="s2">
  <img class="full" src="p_open.png" alt="" />
</section>
<section class="slide" id="s3">
  <img class="full" src="p_wide.png" alt="" />
  <div class="cta">לתכנון קיר משלכם<br /><em>דברו איתנו בוואטסאפ</em></div>
  </section>
</body>
</html>
