<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<!-- Latte/walnut post v2 (after her feedback): her examples' language — whole work, straight, full-bleed;
     two-line headline tied to THIS photo (line 2 gold = gentle turn); logo; CTA on the last slide. -->
<style>
@font-face{font-family:"Heebo";src:url(heebo.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;font-family:"Heebo"}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:#1c1816}
.full{position:absolute;inset:0;width:1080px;height:1350px}
.shade{position:absolute;left:0;right:0;top:0;height:560px;background:linear-gradient(180deg,rgba(18,14,12,.68) 0%,rgba(18,14,12,.42) 48%,rgba(18,14,12,0) 100%)}
.foot{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(0deg,rgba(18,14,12,.6) 0%,rgba(18,14,12,.3) 50%,rgba(18,14,12,0) 100%)}
.head{position:absolute;top:70px;right:64px;left:64px;text-align:right;direction:rtl}
.h1,.h2{font-weight:850;font-size:98px;line-height:1.04;letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.h1{color:#fff}.h2{color:#d8b878;margin-top:2px}
.sub{margin-top:24px;font-weight:500;font-size:36px;color:#f1e9df}
.logo{position:absolute;left:44px;bottom:30px;width:150px}
.vig{position:absolute;left:-120px;bottom:-140px;width:560px;height:560px;background:radial-gradient(closest-side,rgba(18,14,12,.78),rgba(18,14,12,.45) 55%,rgba(18,14,12,0))}
.cta{position:absolute;right:64px;bottom:64px;text-align:right;direction:rtl}
.cta .a{font-weight:600;font-size:36px;color:#fff}
.cta .b{font-weight:800;font-size:42px;color:#d8b878;margin-top:6px}
</style>
</head>
<body>

<section class="slide">
  <img class="full" src="front.png" alt="" /><div class="shade"></div><div class="foot"></div>
  <div class="head"><div class="h1">עץ חם לטלוויזיה.</div><div class="h2">חזיתות שקטות מסביב.</div>
    <div class="sub">קיר טלוויזיה בלאטה מט ואגוז מוסקט</div></div>
  <div class="vig"></div><img class="logo" src="logo_light.png" alt="אבן ועץ" />
</section>

<section class="slide">
  <img class="full" src="open.png" alt="" /><div class="shade"></div><div class="foot"></div>
  <div class="head"><div class="h1">מאחורי החזיתות,</div><div class="h2">עוד קיר של אחסון.</div>
    <div class="sub">פתרונות אחסון נסתרים</div></div>
  <div class="vig"></div><img class="logo" src="logo_light.png" alt="אבן ועץ" />
</section>

<section class="slide">
  <img class="full" src="wide.png" alt="" /><div class="shade"></div><div class="foot"></div>
  <div class="head"><div class="h1">אור בין המדפים.</div><div class="h2">ואור מתחת לבסיס.</div>
    <div class="sub">קיר טלוויזיה בהתאמה אישית</div></div>
  <div class="vig"></div><img class="logo" src="logo_light.png" alt="אבן ועץ" />
  <div class="cta"><div class="a">לתכנון קיר משלכם</div><div class="b">דברו איתנו בוואטסאפ</div></div>
</section>

</body>
</html>
