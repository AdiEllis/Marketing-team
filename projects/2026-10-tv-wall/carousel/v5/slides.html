<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<!-- agents/post-designer.md v2 + copywriter "natural punch": bold two-tone headline, graded full-bleed photo, logo + CTA on every slide -->
<style>
@font-face{font-family:"Heebo";src:url(heebo.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1f1a17;--bronze:#a8763e;--gold:#d8b878;--pill:#1c1816}
body{width:1080px;direction:rtl;font-family:"Heebo"}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:#222}
.slide > img.photo{position:absolute;inset:0;width:1080px;height:1350px;object-fit:cover;display:block}
.head{position:absolute;top:72px;right:64px;left:64px;text-align:right}
.h1{font-weight:850;font-size:98px;line-height:1.02;letter-spacing:-.01em;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.h2{font-weight:850;font-size:98px;line-height:1.02;letter-spacing:-.01em;color:var(--gold);margin-top:4px;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.sub{display:flex;align-items:center;gap:22px;margin-top:26px;font-weight:500;font-size:38px;color:#f4eee6}
.sub i{display:block;width:70px;height:3px;background:var(--gold);border-radius:2px}
.shade{position:absolute;left:0;right:0;top:0;height:640px;background:linear-gradient(180deg,rgba(18,14,12,.62) 0%,rgba(18,14,12,.38) 45%,rgba(18,14,12,0) 100%)}
.logo{position:absolute;left:52px;bottom:48px;width:150px}
.cta{position:absolute;right:56px;bottom:62px;height:96px;padding:0 44px;border-radius:48px;display:flex;align-items:center;font-weight:700;font-size:38px;color:#fff;background:var(--pill);box-shadow:0 14px 34px rgba(0,0,0,.28)}
.cta.gold{background:linear-gradient(180deg,#d9b97c,#b98c4f);color:#1c1714}
</style>
</head>
<body>

<section class="slide" id="s1">
  <img class="photo" src="open.png" alt="" />
  <div class="shade"></div>
  <div class="head">
    <div class="h1">האחסון נסתר.</div>
    <div class="h2">הסלון נשאר נקי.</div>
    <div class="sub"><span>פתרונות אחסון מאחורי כל החזיתות</span><i></i></div>
  </div>
  <img class="logo" src="logo_light.png" alt="אבן ועץ" />
  <div class="cta gold">דברו איתנו בוואטסאפ</div>
</section>

<section class="slide" id="s2">
  <img class="photo" src="front.png" alt="" />
  <div class="shade"></div>
  <div class="head">
    <div class="h1">חזיתות לאטה מט.</div>
    <div class="h2">מסגרת אגוז מוסקט.</div>
    <div class="sub"><span>קיר טלוויזיה בהתאמה אישית</span><i></i></div>
  </div>
  <img class="logo" src="logo_light.png" alt="אבן ועץ" />
  <div class="cta gold">דברו איתנו בוואטסאפ</div>
</section>

<section class="slide" id="s3">
  <img class="photo" src="angle.png" alt="" />
  <div class="shade"></div>
  <div class="head">
    <div class="h1">נמדד ונבנה</div>
    <div class="h2">בדיוק לקיר הזה.</div>
    <div class="sub"><span>בסיס מרחף ותאורה לאורך כל הקיר</span><i></i></div>
  </div>
  <img class="logo" src="logo_light.png" alt="אבן ועץ" />
  <div class="cta gold">דברו איתנו בוואטסאפ</div>
</section>

</body>
</html>
