<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<!-- Walnut + slat wall reel v1 "נראה כמו קיר. / עובד כמו ארון." Signature: the wall-trick — three hard cuts ON THE BEAT
     between the real closed and open photos (same angle, aligned) while ONE camera keeps pushing (never restarts),
     each switch faster; long look on the open tall cabinet; motion dissolve to the real close-up, its LEDs breathe;
     end card with her own line. (3D door animation rejected: the two photos have parallax at the near cabinets.) -->
<style>
@font-face{font-family:"Heebo";src:url(assets/heebo.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1c1816}
#root{width:100%;height:100%;position:relative;overflow:hidden;background:#1c1816}
.lay{position:absolute;inset:0;overflow:hidden}
.st{position:absolute;left:0;top:0;width:1179px}
.st img{position:absolute;left:0;top:0;display:block;width:1179px}
.st img.bl{mix-blend-mode:screen;opacity:0}
.t{position:absolute;direction:rtl;text-align:right;font-family:"Heebo";font-weight:850;line-height:1.02;letter-spacing:-.01em;white-space:nowrap;color:#24170f}
.t .ln{display:block;overflow:hidden;padding:0 6px 12px}
.t span{display:inline-block}
.t em{font-style:normal;color:#3d2410}
#end{position:absolute;inset:0;background:radial-gradient(110% 80% at 50% 45%,#3b2617 0%,#1f140c 75%);opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;direction:rtl}
#endin{display:flex;flex-direction:column;align-items:center}
#end img{width:280px}
#end .l1{margin-top:60px;font-family:"Heebo";font-weight:800;font-size:64px;line-height:1.15;color:#fff;text-align:center}
#end .l1 em{font-style:normal;color:#d8b878}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">

  <div id="scene" class="clip" data-start="0" data-duration="15" data-track-index="0" style="position:absolute;inset:0">
    <div id="LC" class="lay"><div class="st" id="sC"><img src="assets/closed.png" alt="" /><img class="bl" id="bC" src="assets/closed_bloom.jpg" alt="" /></div></div>
    <div id="LO" class="lay"><div class="st" id="sO"><img src="assets/open.png" alt="" /><img class="bl" id="bO" src="assets/open_bloom.jpg" alt="" /></div></div>
    <div id="LD" class="lay"><div class="st" id="sD"><img src="assets/detail.png" alt="" /><img class="bl" id="bD" src="assets/detail_bloom.jpg" alt="" /></div></div>
  </div>

  <div id="txt" class="clip" data-start="0" data-duration="15" data-track-index="1" style="position:absolute;inset:0">
    <div id="t1" class="t" style="right:40px;top:1440px;font-size:80px"><div class="ln"><span>נראה</span> <span>כמו</span> <span><em>קיר.</em></span></div></div>
    <div id="t2" class="t" style="left:385px;width:240px;text-align:center;top:930px;font-size:86px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4)"><div class="ln"><span>עובד</span></div><div class="ln"><span>כמו</span></div><div class="ln"><span style="color:#ffd99a">ארון.</span></div></div>
  </div>

  <div id="endwrap" class="clip" data-start="0" data-duration="15" data-track-index="2" style="position:absolute;inset:0">
    <div id="end"><div id="endin"><img src="assets/logo_light.png" alt="אבן ועץ" /><div class="l1">כל קיר יכול לעשות<br /><em>הרבה יותר.</em></div></div></div>
  </div>
</div>

<script>
const tl = gsap.timeline({ paused: true });
const v = (cx, cy, s) => ({ scale: s, x: 540 - cx * s, y: 960 - cy * s });
gsap.set(".st", { transformOrigin: "0 0" });
const card = (sel, at, out) => {
  tl.fromTo(sel + " span", { yPercent: 115 }, { yPercent: 0, duration: 0.45, stagger: 0.07, ease: "power3.out", immediateRender: false }, at);
  tl.to(sel + " span", { yPercent: -115, duration: 0.3, stagger: 0.04, ease: "power2.in" }, out);
};
gsap.set(".t span", { yPercent: 115 });
gsap.set(["#LO", "#LD"], { opacity: 0 });

// A 0–7.35  ONE camera over the aligned closed/open pair: a steady push from the wall toward the tall cabinet
const A0 = v(500, 750, 1.33), A1 = v(470, 690, 1.6);
gsap.set(["#sC", "#sO"], A0);
tl.fromTo(["#sC", "#sO"], A0, { ...A1, duration: 6.95, ease: "none", immediateRender: false }, 0);
gsap.set(["#bC", "#bO"], { opacity: 0.2 });
card("#t1", 0.3, 1.45);   // fully gone before the first cut at 2.0
// the wall-trick: hard cuts on the beat (120 bpm), each switch faster; the camera never stops
tl.set("#LO", { opacity: 1 }, 2.0);    // open
tl.set("#LO", { opacity: 0 }, 3.0);    // closed
tl.set("#LO", { opacity: 1 }, 3.5);    // open — and stay
card("#t2", 3.62, 6.2);
tl.to("#bO", { opacity: 0.6, duration: 1.0, ease: "sine.inOut" }, 4.6);   // the niche LED glows on the long look

// D 6.95–12.9  ONE whip to the real close-up, done INSIDE the photos (the frame is always full): the camera on the wall
// accelerates right with motion blur, the close-up arrives already moving right, blur 14 -> 0, then keeps gliding right
const D0 = v(372, 720, 1.5), D1 = v(560, 700, 1.42), D2 = v(600, 735, 1.31);
const AW = v(760, 690, 1.6);
tl.to(["#sC", "#sO"], { ...AW, duration: 0.24, ease: "power2.in" }, 6.95);
tl.fromTo("#LO", { filter: "blur(0px)" }, { filter: "blur(14px)", duration: 0.24, ease: "power2.in", immediateRender: false }, 6.95);
tl.set("#LD", { opacity: 1, filter: "blur(14px)" }, 7.19);
tl.set(["#LC", "#LO"], { opacity: 0 }, 7.19);
tl.to("#LD", { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 7.19);
gsap.set("#sD", D0);
tl.fromTo("#sD", D0, { ...D2, duration: 5.7, ease: "sine.out", immediateRender: false }, 7.19);   // ONE glide, slowing only toward the end
gsap.set("#bD", { opacity: 0.15 });
tl.to("#bD", { opacity: 0.75, duration: 1.1, ease: "sine.inOut" }, 8.3);
tl.to("#bD", { opacity: 0.3, duration: 1.2, ease: "sine.inOut" }, 9.4);
tl.to("#bD", { opacity: 0.7, duration: 1.0, ease: "sine.inOut" }, 11.0);

// E 12.6–15.5  end card, her own line
tl.fromTo("#end", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut", immediateRender: false }, 12.6);
gsap.set(["#end img", "#end .l1"], { opacity: 0 });
tl.fromTo("#end img", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 13.1);
tl.fromTo("#end .l1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, immediateRender: false }, 13.4);
tl.fromTo("#endin", { scale: 1 }, { scale: 1.07, duration: 2.4, ease: "none", immediateRender: false }, 12.6);

window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body>
</html>
