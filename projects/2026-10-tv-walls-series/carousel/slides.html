<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<!-- TV walls series post v1. IDEA: "לכל בית, הקיר שלו." Four TV walls built from the same vocabulary (slats, hidden light,
     a console off the floor) and none of them alike -> planning from zero for each home -> come plan yours.
     S1 cover: the white wall, whole, headline on the plain ceiling. S2/S3: one whole wall each + ONE quiet line naming what
     only that wall does (on the plain floor). S4: the dark wall + the reason to call (free consultation + rendering) + logo.
     Whole walls on every slide, no bands, no scrims, no numbering. -->
<style>
@font-face{font-family:"Heebo";src:url(heebo.ttf);font-weight:100 900}
@font-face{font-family:"Plex";src:url(plex-Regular.ttf);font-weight:400}
@font-face{font-family:"Plex";src:url(plex-Medium.ttf);font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;font-family:"Heebo"}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden}
.full{position:absolute;inset:0;width:1080px;height:1350px}
.h{position:absolute;direction:rtl;text-align:right;font:850 92px/1.04 "Heebo";letter-spacing:-.015em;color:#1f1813}
.h em{display:block;font-style:normal;color:#8a5a26}
.sub{position:absolute;direction:rtl;text-align:right;font:500 30px/1.3 "Plex";color:#3a2c22;letter-spacing:.005em}
.cap{position:absolute;direction:rtl;text-align:right;font:500 33px/1.3 "Plex";color:#2a211b}
.cap::before{content:"";display:block;width:56px;height:3px;background:#a8763e;margin:0 0 16px auto}
#s1 .h{right:500px;top:48px}
#s1 .sub{right:504px;top:258px;font-size:28px}
#s2 .cap{left:70px;bottom:40px}
#s3 .cap{right:64px;bottom:52px}
#s4 .h{right:0;left:0;text-align:center;top:146px;font-size:54px;line-height:1.1}
#s4 .h em{display:inline;color:#8a5a26}
#s4 .logo{position:absolute;right:62px;top:30px;width:92px}
#s4 .sub{left:0;right:0;text-align:center;bottom:40px;font-size:31px;color:#2a211b}
</style>
</head>
<body>
<section class="slide" id="s1">
  <img class="full" src="p_white.png" alt="" />
  <div class="h">לכל בית,<em>הקיר שלו.</em></div>
  <div class="sub">קירות טלוויזיה, כל אחד בתכנון משלו</div>
</section>
<section class="slide" id="s2">
  <img class="full" src="p_panels.png" alt="" />
  <div class="cap">חלוקת פאנלים,<br>וגוון עץ מאחורי המסך.</div>
</section>
<section class="slide" id="s3">
  <img class="full" src="p_slats.png" alt="" />
  <div class="cap">החיפוי ממשיך<br>אל המזנון.</div>
</section>
<section class="slide" id="s4">
  <img class="full" src="p_dark.png" alt="" />
  <div class="h">הקיר הבא <em>מתוכנן לבית שלכם.</em></div>
  <img class="logo" src="logo_alpha.png" alt="אבן ועץ" />
  <div class="sub">פגישת ייעוץ והדמיה ללא עלות</div>
</section>
</body>
</html>
