<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<!-- Reel v5 (flow 2, approved plan): "מבפנים החוצה" — niche first, speed-ramp pull-out, doors open in a cascade on the beat,
     punch + whip through the shelves, all doors close together, loop back to the glowing niche. 11 words on screen. -->
<style>
@font-face{font-family:"Heebo";src:url(assets/heebo.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0d0a08}
#root{width:100%;height:100%;position:relative;overflow:hidden;background:#0d0a08}

/* stage = the room (her AI set extension) with the real closet pixels composited in; 1357x2411 */
#cam{position:absolute;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1357px;height:2411px;perspective:1800px;perspective-origin:680px 1030px}
#stage img{position:absolute;left:0;top:0;width:1357px;height:2411px;display:block}

/* real door faces (from the real closed photo); hinge sides from the real open photo */
.door{position:absolute;top:282px;height:1491px;transform-style:preserve-3d}
.door .face{position:absolute;inset:0;background-image:url(assets/room_closed_fix.jpg);background-size:1357px 2411px;backface-visibility:hidden}
.door .back{position:absolute;inset:0;background-image:url(assets/room_closed_fix.jpg);background-size:1357px 2411px;transform:rotateY(180deg) translateZ(1px);backface-visibility:hidden;filter:brightness(.86)}
.door .shade{position:absolute;inset:0;opacity:0}
.door .fs{position:absolute;left:0;top:100%;width:100%;height:70px;transform-origin:50% 0;transform:rotateX(90deg);background:linear-gradient(180deg,rgba(20,14,9,.7) 0,rgba(20,14,9,.35) 10px,rgba(20,14,9,0) 100%);filter:blur(4px);opacity:0}
.door .refl{position:absolute;left:0;top:100%;width:100%;height:420px;background-image:url(assets/room_closed_fix.jpg);background-size:1357px 2411px;transform:scaleY(-1);transform-origin:50% 0;filter:blur(6px);opacity:0;-webkit-mask-image:linear-gradient(0deg,#000 0,transparent 100%)}
.door .bot{position:absolute;left:0;bottom:0;width:100%;height:22px;background-image:url(assets/room_closed_fix.jpg);background-size:1357px 2411px;opacity:0}
.bay{position:absolute;top:282px;height:1491px;opacity:0}
.door .edge{position:absolute;top:0;width:11px;height:100%;transform-origin:0 50%;transform:rotateY(90deg);background:linear-gradient(90deg,#8f8476 0,#8f8476 1px,#ddd4c7 2px,#c6bbab)}
#d1{left:41px;width:265px;transform-origin:0 50%}    #d1 .face,#d1 .back{background-position:-41px -282px} #d1 .refl{background-position:-41px -1353px} #d1 .bot{background-position:-41px -1727px}   #d1 .edge{left:100%}   #d1 .shade{background:linear-gradient(90deg,rgba(70,50,32,1),rgba(70,50,32,.35))}
#d2{left:306px;width:275px;transform-origin:100% 50%} #d2 .face,#d2 .back{background-position:-306px -282px} #d2 .refl{background-position:-306px -1353px} #d2 .bot{background-position:-306px -1727px}  #d2 .edge{left:0}   #d2 .shade{background:linear-gradient(270deg,rgba(70,50,32,1),rgba(70,50,32,.35))}
#d3{left:776px;width:266px;transform-origin:0 50%}   #d3 .face,#d3 .back{background-position:-776px -282px} #d3 .refl{background-position:-776px -1353px} #d3 .bot{background-position:-776px -1727px}  #d3 .edge{left:100%}   #d3 .shade{background:linear-gradient(90deg,rgba(70,50,32,1),rgba(70,50,32,.35))}
#d4{left:1042px;width:272px;transform-origin:100% 50%} #d4 .face,#d4 .back{background-position:-1042px -282px} #d4 .refl{background-position:-1042px -1353px} #d4 .bot{background-position:-1042px -1727px} #d4 .edge{left:0}   #d4 .shade{background:linear-gradient(270deg,rgba(70,50,32,1),rgba(70,50,32,.35))}
/* interior is in the door's shadow until it swings away (darker toward the hinge) */
#bL{left:41px;width:540px;background:rgba(24,17,11,.62);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 60px,#000 480px,transparent 540px)}
#bR{left:776px;width:538px;background:rgba(24,17,11,.62);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 60px,#000 478px,transparent 538px)}
/* center column (small doors + niche) always from the closed photo: the open photo carries the open door's shadow on it */
#col{position:absolute;left:583px;top:282px;width:191px;height:1491px;background-image:url(assets/room_closed_fix.jpg);background-size:1357px 2411px;background-position:-583px -282px}
.cast{position:absolute;top:282px;height:1491px;width:220px;opacity:0}
#sh2{left:361px;background:linear-gradient(270deg,rgba(30,22,15,.45),rgba(30,22,15,0))}
#sh3{left:776px;background:linear-gradient(90deg,rgba(30,22,15,.45),rgba(30,22,15,0))}

/* soft rectangular dimming around the real LED niche (max ~45%, fronts stay readable) */
#night{position:absolute;left:586px;top:725px;width:190px;height:700px;box-shadow:0 0 120px 2600px rgba(42,27,14,.40);border-radius:6px}
#spill{position:absolute;inset:0;background:radial-gradient(ellipse 280px 560px at 680px 1076px,rgba(255,170,85,.22),rgba(255,170,85,0) 75%);mix-blend-mode:screen}

.t{position:absolute;direction:rtl;text-align:right;right:72px;left:72px;font-family:"Heebo";font-weight:850;letter-spacing:-.01em;line-height:1.04}
.t .ln{display:block;overflow:hidden;padding:0 4px 12px}
.t span{display:inline-block}
.lite{color:#fff;text-shadow:0 2px 22px rgba(0,0,0,.35)}
.ink{color:#2a211b}
#topshade{position:absolute;left:0;right:0;top:0;height:640px;background:linear-gradient(180deg,rgba(20,15,11,.6),rgba(20,15,11,0));opacity:0}
#endc{position:absolute;inset:0;background:radial-gradient(110% 80% at 50% 45%,#3b2617 0%,#1f140c 75%);opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;direction:rtl}
#endc img{width:290px}
#endc .l1{margin-top:56px;font-family:"Heebo";font-weight:800;font-size:60px;color:#fff}
#endc .l2{margin-top:18px;font-family:"Heebo";font-weight:400;font-size:40px;color:#e3d3bf}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">

  <div id="cam" class="clip" data-start="0" data-duration="15" data-track-index="0">
    <div id="stage" data-layout-allow-overflow>
      <img src="assets/room_open.jpg" alt="" />
      <div id="col"></div>
      <div class="bay" id="bL"></div><div class="bay" id="bR"></div>
      <div class="cast" id="sh2"></div><div class="cast" id="sh3"></div>
      <div class="door" id="d1"><div class="face"></div><div class="back"></div><div class="shade"></div><div class="edge"></div><div class="bot"></div><div class="fs"></div><div class="refl"></div></div>
      <div class="door" id="d2"><div class="face"></div><div class="back"></div><div class="shade"></div><div class="edge"></div><div class="bot"></div><div class="fs"></div><div class="refl"></div></div>
      <div class="door" id="d3"><div class="face"></div><div class="back"></div><div class="shade"></div><div class="edge"></div><div class="bot"></div><div class="fs"></div><div class="refl"></div></div>
      <div class="door" id="d4"><div class="face"></div><div class="back"></div><div class="shade"></div><div class="edge"></div><div class="bot"></div><div class="fs"></div><div class="refl"></div></div>
      <div id="night"></div>
      <div id="spill"></div>
    </div>
    <div id="topshade"></div>
  </div>

  <div id="txt" class="clip" data-start="0" data-duration="15" data-track-index="1" style="position:absolute;inset:0">
    <div id="c1" class="t lite" style="top:300px;font-size:120px"><div class="ln"><span>מקום</span> <span>של</span> <span>כבוד.</span></div></div>
    <div id="c2" class="t ink" style="top:1440px;font-size:96px"><div class="ln"><span>בין</span> <span>דלתות</span> <span>חלקות.</span></div></div>
    <div id="c3" class="t ink" style="top:1500px;font-size:96px"><div class="ln"><span>ומאחורי</span> <span>הדלתות,</span></div></div>
    <div id="c4" class="t lite" style="top:250px;font-size:110px"><div class="ln"><span>מקום</span> <span>לכל</span> <span>השאר.</span></div></div>
    <div id="endc"><img src="assets/logo_light.png" alt="אבן ועץ" /><div class="l1">ארון ילדים בהתאמה אישית</div><div class="l2">דברו איתנו בוואטסאפ</div></div>
  </div>
</div>

<script>
const tl = gsap.timeline({ paused: true });
const S0 = 1080 / 1357;
const view = (cx, cy, z) => { const s = S0 * z; return { scale: s, x: 540 - cx * s, y: 960 - cy * s }; };
const st = "#stage";
gsap.set(st, { transformOrigin: "0 0" });
const card = (sel, at, out) => {
  tl.fromTo(sel + " span", { yPercent: 110 }, { yPercent: 0, duration: 0.45, stagger: 0.07, ease: "power4.out" }, at);
  tl.to(sel + " span", { yPercent: -110, duration: 0.3, stagger: 0.04, ease: "power3.in" }, out);
};
const NICHE = view(680, 1075, 1.7);

// B1 0–1.4  frame 0: the whole lit niche, soft dimming around it, gentle push
tl.fromTo(st, NICHE, { ...view(680, 1068, 1.76), duration: 1.4, ease: "none" }, 0);
card("#c1", 0.15, 1.3);

// B2 1.4–2.6  speed-ramp pull-out to the whole closet, dimming lifts
tl.to(st, { ...view(680, 1205, 1.0), duration: 1.2, ease: "power4.out" }, 1.4);
tl.to("#night", { opacity: 0, duration: 0.9, ease: "power1.out" }, 1.45);
tl.to("#spill", { opacity: 0.35, duration: 0.9 }, 1.45);
card("#c2", 2.0, 3.45);

// B3 3.6–4.0  punch toward the closet
tl.to(st, { ...view(680, 1150, 1.12), duration: 0.35, ease: "power4.out" }, 3.6);

// B4 4.0–6.6  signature: the doors open in a cascade on the beat (right to left), realistic swing
const swing = (id, sign, at, dur, opening, handover) => {
  const from = opening ? 0 : sign * 92, to = opening ? sign * 92 : 0;
  const ease = opening ? "power2.inOut" : "power2.in";
  if (!opening && handover) tl.set(id, { opacity: 1 }, at);
  tl.fromTo(id, { rotationY: from }, { rotationY: to, duration: dur, ease, immediateRender: false }, at);
  // face turns away from the room light (warm, max .28); contact shadow, faint floor reflection; baked floor line hidden while swinging
  const on = { ".shade": 0.28, ".fs": 0.5, ".bot": 1 };
  for (const [el, v] of Object.entries(on))
    tl.fromTo(id + " " + el, { opacity: opening ? 0 : v }, { opacity: opening ? v : 0, duration: el === ".bot" ? 0.12 : dur, ease, immediateRender: false }, el === ".bot" && !opening ? at + dur - 0.12 : at);
  if (opening && handover) tl.set(id, { opacity: 0 }, at + dur);   // one-frame hand-over to the same door in the real open photo (no ghost)
};
// interior of each bay sits in the doors' shadow until both its doors swing away (soft-edged, one layer per bay)
const bayLight = (bay, from, to, opening) => {
  if (opening) { tl.set(bay, { opacity: 1 }, from); tl.to(bay, { opacity: 0, duration: to - from, ease: "power1.inOut" }, from); }
  else { tl.fromTo(bay, { opacity: 0 }, { opacity: 1, duration: to - from, ease: "power1.in", immediateRender: false }, from); tl.set(bay, { opacity: 0 }, to + 0.02); }
};
const cast = (id, at, dur) => { tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: dur * 0.5, ease: "sine.out", immediateRender: false }, at);
  tl.to(id, { opacity: 0, duration: dur * 0.5, ease: "sine.in" }, at + dur * 0.5); };
tl.set(["#d1", "#d2", "#d3", "#d4"], { rotationY: 0, opacity: 1 }, 0);
swing("#d4", 1, 4.0, 1.3, true, false);
bayLight("#bR", 4.0, 5.85, true);
bayLight("#bL", 5.1, 6.95, true);
swing("#d3", -1, 4.55, 1.3, true, true);  cast("#sh3", 4.55, 1.3);
swing("#d2", 1, 5.1, 1.3, true, true);    cast("#sh2", 5.1, 1.3);
swing("#d1", -1, 5.65, 1.3, true, false);
card("#c3", 4.25, 6.1);

// B5 6.3–7.6  punch into the left shelves
tl.to("#topshade", { opacity: 1, duration: 0.4 }, 6.4);
tl.to(st, { ...view(480, 1000, 1.6), duration: 0.45, ease: "power4.out" }, 6.35);
tl.to(st, { ...view(470, 1060, 1.62), duration: 0.85, ease: "sine.inOut" }, 6.8);
card("#c4", 6.55, 7.5);
// B6 7.6–8.0  whip to the right bay
tl.to(st, { ...view(890, 1060, 1.62), duration: 0.4, ease: "power3.inOut" }, 7.65);
tl.fromTo("#cam", { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.2, ease: "power2.in", immediateRender: false }, 7.65);
tl.to("#cam", { filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 7.85);
tl.to("#topshade", { opacity: 0, duration: 0.4 }, 7.7);
// B7 8.0–9.4  glide down the right shelves
tl.to(st, { ...view(890, 1380, 1.62), duration: 1.4, ease: "sine.inOut" }, 8.05);

// B8 9.4–10.6  back out, all doors close together (pattern break)
tl.to(st, { ...view(680, 1150, 1.12), duration: 0.55, ease: "power3.inOut" }, 9.4);
// slightly staggered like real hands, soft-close landing ~11.15 (on the beat)
swing("#d4", 1, 10.05, 1.05, false, false);  swing("#d3", -1, 10.1, 1.05, false, true);
swing("#d2", 1, 10.13, 1.02, false, true);   swing("#d1", -1, 10.08, 1.07, false, false);
cast("#sh2", 10.13, 1.02); cast("#sh3", 10.1, 1.05);
bayLight("#bL", 10.1, 11.15, false); bayLight("#bR", 10.1, 11.15, false);

// B9 10.6–12.6  wide, dimming returns, slow push toward the glowing niche
tl.to(st, { ...view(680, 1205, 1.0), duration: 0.5, ease: "power2.out" }, 11.2);
tl.to("#night", { opacity: 1, duration: 0.8, ease: "power1.inOut" }, 11.25);
tl.to("#spill", { opacity: 1, duration: 0.8 }, 11.25);
tl.to(st, { ...NICHE, duration: 1.1, ease: "sine.inOut" }, 11.65);
// B10 12.7–15  end card on warm espresso
tl.fromTo("#endc", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 12.7);
tl.fromTo("#endc img", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 12.9);
tl.fromTo("#endc .l1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5 }, 13.2);
tl.fromTo("#endc .l2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5 }, 13.45);

window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body>
</html>
