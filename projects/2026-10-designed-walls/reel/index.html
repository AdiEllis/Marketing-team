<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<script src="assets/reel-kit.js"></script>
<link rel="stylesheet" href="assets/reel-kit.css" />
<!-- Designed walls (general brand content), approved card 16.10. "The line continues": the vertical slats that every one
     of the four walls has are the bridge between homes. Beat grid 112 bpm (B = 0.536 s). Stage coords = source px.
     A 0–2.95     dark wall, whole, pushing toward its left slats      "קיר מעוצב / משנה את כל הסלון."
     MATCH 2.95   slat match: camera drops fast, vertical streak (slats stay lines), lands on the panels wall's slat strip
     B 2.95–6.1   pan right to the wood panel + LED                     "עיצוב ותאורה / בקיר אחד."
     DISSOLVE 6.1 motion dissolve (both panning right) -> beige slats wall
     C 6.1–9.0    glide to the slatted floating console                 "חומרים איכותיים, / מראה נקי ויוקרתי."
     RUSH 9.0     signature: three slat matches on the beat C -> A -> B -> D (speed ramp)
     D 10.07–     white wall lands in its lower slat band, pulls back to the whole lit wall (light moment 11.0–14.6,
                  the photo's own light, gentle breathing)            "הקיר הבא / יכול להיות אצלכם."
     END 14.6     brown end card (fixed). -->
<style>
.t{left:0;width:1080px;text-align:center;color:#2e2a27}
.t .ln + .ln, .t em{color:#9a7449}
#t1,#t2,#t3,#t4{top:190px;font-size:84px}
#t1{top:165px}
#t4{top:168px}
.lay.vb{will-change:filter}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="fA" x="0" y="-5%" width="100%" height="110%"><feGaussianBlur id="gA" stdDeviation="0 0" /></filter>
  <filter id="fB" x="0" y="-5%" width="100%" height="110%"><feGaussianBlur id="gB" stdDeviation="0 0" /></filter>
  <filter id="fC" x="0" y="-5%" width="100%" height="110%"><feGaussianBlur id="gC" stdDeviation="0 0" /></filter>
  <filter id="fA2" x="0" y="-5%" width="100%" height="110%"><feGaussianBlur id="gA2" stdDeviation="0 0" /></filter>
  <filter id="fB2" x="0" y="-5%" width="100%" height="110%"><feGaussianBlur id="gB2" stdDeviation="0 0" /></filter>
  <filter id="fD" x="0" y="-5%" width="100%" height="110%"><feGaussianBlur id="gD" stdDeviation="0 0" /></filter>
</svg>
<div id="root" data-composition-id="main" data-start="0" data-duration="18.6" data-width="1080" data-height="1920">
  <div id="scene" class="clip" data-start="0" data-duration="18.6" data-track-index="0" style="position:absolute;inset:0">
    <!-- later stages first (underneath), frame-0 stage last (on top) -->
    <div id="LD" class="lay" style="filter:url(#fD)"><div class="st" id="sD" style="width:934px;height:1448px"><img src="assets/white_ext.png" style="width:934px;height:1448px" alt="" /><img class="bl" id="bD" src="assets/white_ext_bloom.jpg" style="width:934px;height:1448px" alt="" /></div></div>
    <div id="LB2" class="lay" style="filter:url(#fB2)"><div class="st" id="sB2" style="width:1166px;height:1245px"><img src="assets/panels.png" style="width:1166px;height:1245px" alt="" /></div></div>
    <div id="LA2" class="lay" style="filter:url(#fA2)"><div class="st" id="sA2" style="width:1178px;height:1780px"><img src="assets/dark_ext.png" style="width:1178px;height:1780px" alt="" /></div></div>
    <div id="LC" class="lay" style="filter:url(#fC)"><div class="st" id="sC" style="width:977px;height:1110px"><img src="assets/slats.png" style="width:977px;height:1110px" alt="" /></div></div>
    <div id="LB" class="lay" style="filter:url(#fB)"><div class="st" id="sB" style="width:1166px;height:1245px"><img src="assets/panels.png" style="width:1166px;height:1245px" alt="" /><img class="bl" id="bB" src="assets/panels_bloom.jpg" style="width:1166px;height:1245px" alt="" /></div></div>
    <div id="LA" class="lay" style="filter:url(#fA)"><div class="st" id="sA" style="width:1178px;height:1780px"><img src="assets/dark_ext.png" style="width:1178px;height:1780px" alt="" /><img class="bl" id="bA" src="assets/dark_ext_bloom.jpg" style="width:1178px;height:1780px" alt="" /></div></div>
  </div>
  <div id="txt" class="clip" data-start="0" data-duration="18.6" data-track-index="1" style="position:absolute;inset:0">
    <div id="t1" class="t"><div class="ln"><span>קיר</span> <span>מעוצב</span></div><div class="ln"><span>משנה</span> <span>את</span> <span>כל</span> <span>הסלון.</span></div></div>
    <div id="t2" class="t"><div class="ln"><span>עיצוב</span> <span>ותאורה</span></div><div class="ln"><span>בקיר</span> <span>אחד.</span></div></div>
    <div id="t3" class="t"><div class="ln"><span>חומרים</span> <span>איכותיים,</span></div><div class="ln"><span>מראה</span> <span>נקי</span> <span>ויוקרתי.</span></div></div>
    <div id="t4" class="t"><div class="ln"><span>הקיר</span> <span>הבא</span></div><div class="ln"><span>יכול</span> <span>להיות</span> <span>אצלכם.</span></div></div>
    <div id="end"><div id="endglow"></div><div id="endin"><img src="assets/logo_light.png" alt="אבן ועץ" /><div class="l1">כל הבית,<em>במקום אחד.</em></div><div class="l2">ייעוץ והדמיה ללא עלות</div></div></div>
  </div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const K = RK.kit(tl);
const B = 60 / 112;
gsap.set(["#LB", "#LC", "#LA2", "#LB2", "#LD"], { opacity: 0 });

// slat match: vertical-only blur (the slats stay lines, everything else streaks), short crossfade at the peak
const vb = (g, t0, t1, a, b) =>
  tl.fromTo(g, { attr: { stdDeviation: `0 ${a}` } }, { attr: { stdDeviation: `0 ${b}` }, duration: t1 - t0, ease: a < b ? "power2.in" : "power2.out", immediateRender: false }, t0);
function match(from, gFrom, to, gTo, t, px = 18, inDur = 0.16, outDur = 0.16) {
  // slats of both walls at the same screen x and pitch (~21–26 px): a short vertical smear, a 2-frame crossfade
  vb(gFrom, t - inDur, t, 0, px);
  vb(gTo, t, t + outDur, px, 0);
  tl.set(to, { opacity: 1 }, t - 0.03);
  tl.fromTo(from, { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "none", immediateRender: false }, t - 0.03);
}

// A 0–2.95: frame 0 = the dark wall, whole width of the frame, already pushing; then the camera speeds into the left slats
K.path("#sA", [[0, 596, 890, 1.08], [1.5, 525, 1000, 1.4], [2.95, 400, 1150, 2.2]]);  // frame 0: the whole wall (vitrine to console end) on a set-extended ceiling
K.breathe("#bA", [[0, 0.12], [1.4, 0.35], [2.6, 0.15]]);
K.card("#t1", 0.25, 1.85);
match("#LA", "#gA", "#LB", "#gB", 2.95);

// B 2.95–6.1: lands on the panels wall's slat strip (still dropping), pans right to the wood panel and its LED
K.path("#sB", [[2.95, 292, 500, 2.1], [3.4, 305, 600, 1.85], [4.7, 520, 620, 1.76], [6.4, 690, 640, 1.66], [8.0, 790, 640, 1.64]]);
K.breathe("#bB", [[3.6, 0], [4.8, 0.4], [6.2, 0.2], [7.4, 0.35]]);
K.card("#t2", 3.65, 5.5);
K.card("#t3", 5.85, 7.4);
K.dissolve("#LB", "#LC", 7.6, 0.4);

// C 6.1–9.0: beige slats wall, gliding right toward the slatted floating console
K.path("#sC", [[7.6, 410, 548, 1.86], [9.3, 560, 560, 1.80], [10.0, 620, 568, 1.8]]);

// RUSH (signature): slat matches on the beat C -> A -> B -> D, each landing still dropping, with a small punch
match("#LC", "#gC", "#LA2", "#gA2", 10.0);
K.path("#sA2", [[9.95, 345, 1060, 2.75], [10.6, 345, 1260, 2.7]]);
match("#LA2", "#gA2", "#LB2", "#gB2", 10.0 + B);
K.path("#sB2", [[10.49, 235, 450, 2.4], [11.12, 235, 640, 2.4]]);
match("#LB2", "#gB2", "#LD", "#gD", 10.0 + 2 * B);

// D 10.07–14.6: white wall lands in its lit lower slat band, pulls back to the whole lit wall; the photo's own light breathes
K.path("#sD", [[11.02, 600, 1050, 3.4], [11.6, 600, 1000, 2.5], [12.6, 560, 820, 1.6], [15.6, 530, 724, 1.35]]);  // ends on the whole lit wall incl. the vitrine (ceiling set-extended)
K.breathe("#bD", [[11.6, 0], [13.0, 0.45], [14.3, 0.25], [15.6, 0.4]]);
K.card("#t4", 13.4, 15.35);

K.endCard(15.6, 3.0);
K.done(18.6);
</script>
</body>
</html>
