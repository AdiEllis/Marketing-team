<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<!-- Whole-home post v1 — QUIET family (set 2), "room by room" guide.
     "הפוסט הזה מראה ש..." בנגרות לכל הבית כל חדר מקבל פתרון משלו, באותה רמת דיוק, ולכן כדאי לתכנן את כל הבית במקום אחד.
     Every photo whole (4:5 photos = exact fit; the mauve one widened with its own plain wall, wardrobe untouched).
     Text: thin dark topic + insight after a thin bronze L, on a calm surface (floor / plain door / plain panel), never on
     a niche, handle or shelf. No layers anywhere. Closing: oak-tone field + mauve wardrobe + logo. -->
<style>
@font-face{font-family:"Plex";src:url(plex-Light.ttf);font-weight:300}
@font-face{font-family:"Plex";src:url(plex-Regular.ttf);font-weight:400}
@font-face{font-family:"Plex";src:url(plex-Medium.ttf);font-weight:500}
@font-face{font-family:"Plex";src:url(plex-SemiBold.ttf);font-weight:600}
:root{--gold:#D8B878;--bronze:#A8763E;--dark:#1C1816}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--dark)}
.full{position:absolute;inset:0;width:1080px;height:1350px;object-fit:cover}
.quiet{position:absolute;direction:rtl;text-align:right;color:#2a2420}
.quiet h2{font:300 78px/1.05 "Plex";letter-spacing:-.01em}
.quiet p{margin-top:18px;padding:12px 22px 0 0;font:400 36px/1.32 "Plex";border-right:2px solid var(--bronze);border-top:2px solid var(--bronze)}
.quiet.big h2{font-size:92px}
.field{position:absolute;top:0;bottom:0;right:0;width:46%;background:#7a5a42;display:flex;flex-direction:column;align-items:center;justify-content:center;direction:rtl}
.field .logo{width:240px}
.field .line{text-align:center;margin-top:76px;font:300 60px/1.22 "Plex";color:#fff}
.field .line em{font-style:normal;color:var(--gold)}
.field .sub{margin-top:56px;font:400 30px/1.3 "Plex";color:#efe1cf;text-align:center}
.corner{position:absolute;width:44px;height:44px;border-color:var(--gold);border-style:solid;border-width:0}
</style>
</head>
<body>
<section class="slide" id="s1">
  <img class="full" src="p_tv.png" alt="" />
  <div class="quiet big" style="right:70px;bottom:60px"><h2>נגרות לכל הבית</h2><p>חדר-חדר, לפי מה שקורה בו.</p></div>
</section>
<section class="slide" id="s2">
  <img class="full" src="p_mauve.png" alt="" />
  <div class="quiet" style="right:190px;top:840px;width:250px"><h2>הידית</h2><p>גם היא חלק<br />מהעיצוב.</p></div>
</section>
<section class="slide" id="s3">
  <img class="full" src="p_grey.png" alt="" />
  <div class="quiet" style="right:140px;top:840px;width:300px"><h2>עמודה פתוחה</h2><p>ליד הארון,<br />מקום למה<br />שאוהבים להציג.</p></div>
</section>
<section class="slide" id="s4">
  <img class="full" src="p_white_c.png" alt="" />
  <div class="quiet" style="right:150px;top:760px;width:210px"><h2>מבחוץ</h2><p>חזית לבנה<br />ושקטה.</p></div>
</section>
<section class="slide" id="s5">
  <img class="full" src="p_white_o.png" alt="" />
  <div class="quiet" style="right:150px;top:760px;width:210px"><h2>בפנים</h2><p>מוט תלייה<br />שיורד<br />אליכם.</p></div>
</section>
<section class="slide" id="s6">
  <img class="full" src="p_oak_c.png" alt="" />
  <div class="quiet" style="right:70px;bottom:70px"><h2>רצף אחד</h2><p>הארון ממשיך אל הקיר.</p></div>
</section>
<section class="slide" id="s7">
  <img class="full" src="p_oak_o.png" alt="" />
  <div class="quiet" style="right:70px;bottom:60px"><h2>החלוקה הפנימית</h2><p>לפי מה שאתם שומרים.</p></div>
</section>
<section class="slide" id="s8">
  <img class="full" src="p_mauve.png" alt="" style="width:584px;object-position:62% 50%" />
  <div class="field"><img class="logo" src="logo_light.png" alt="אבן ועץ" /><div class="line">כל הבית,<br /><em>במקום אחד.</em></div><div class="sub">ייעוץ והדמיה ללא עלות</div></div>
  <div class="corner" style="right:40px;top:40px;border-top-width:2px;border-right-width:2px"></div>
  <div class="corner" style="left:620px;bottom:40px;border-bottom-width:2px;border-left-width:2px"></div>
</section>
</body>
</html>
