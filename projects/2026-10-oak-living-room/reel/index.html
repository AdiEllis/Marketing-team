<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<script src="assets/reel-kit.js"></script>
<link rel="stylesheet" href="assets/reel-kit.css" />
<!-- Oak living room v1 (13.10). Approved card: "קיר טלוויזיה? זה רק ההתחלה" → whole room → evening falls → niche wall lit.
  Her note at approval: little content → impressive editing, the camera never stands still, never slow.
  ~110 BPM (beat 0.545 s). Stages = her photos cleaned + x2 (work/hq), scale <= 0.875 (= x1.75 source) except inside blur.
  Evening versions (flow/night.py): room darkened, the REAL lit pixels (niche, vitrine, LED strips, reflections) untouched.
  0.00–2.30  A  TV wall (day), frame 0 moving: speed-ramp push → accelerating pan left to the LED slats   "קיר טלוויזיה? / זה רק ההתחלה."
  2.10–2.50  v4: matched pull-back dissolve (TV same size/position in both photos), no whip
  2.30–7.15  R  whole room (day): lands moving, pull-out to both walls                                  "כל החלל / בתכנון אחד."
  4.40–5.45                                                                                             "האור / חלק מהנגרות."
  5.00–6.40  signature "evening falls": the evening photo rises from the floor up, lights stay as shot
  6.30–7.15  push to the niche wall, speed ramp into a dive-through (blur peak 7.15)
  7.15–9.60  N  niche wall at evening: lands on the lit niche, pulls out to the whole wall (light moment, whole, 2 s)
  9.60–12.70 speed-ramp up to the top of the lit vitrine, then the camera DESCENDS along the lit shelves to the floor
             (v2, her note 13.10: the window burst was "not professional"; she loved the descending camera in the sahara reel)
             v3: the niche wall is her new sharp photo (05) — the vitrine is big and crisp, so the descent is closer (x2 source)
  12.30–16.90 A2 motion dissolve into the TV wall at evening, still descending → room lights come back top→down
  14.80–16.70                                                                                           "דברו איתנו / בוואטסאפ"
  16.90–20.00 end card: logo, ייעוץ והדמיה ללא עלות
  Transition families: dive blur (1), matched dissolve (2), light wave (2), motion dissolve (1). v2: photos = AI x4 upscale → x2 (flow/enhance.py). -->
<style>
.ta{width:1800px;height:3200px}
.tr{width:1536px;height:2728px}
.tn{width:1882px;height:3344px}  /* v3: her sharp angled photo of the niche wall (05), evening version */
/* logo tones on every card: line 1 logo grey, line 2 logo wood (same scheme everywhere, her note 13.10) */
.t{left:0;width:1080px;text-align:center;color:#57565b}
.t .ln + .ln{color:#8a6a43}
#t1{top:160px;font-size:86px}
#t2{top:190px;font-size:88px}
#t3{top:190px;font-size:88px}
#t4{top:165px;font-size:78px}
#end .l1{color:#efe6da}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
  <div id="scene" class="clip" data-start="0" data-duration="20" data-track-index="0" style="position:absolute;inset:0">
    <!-- later shots underneath, frame-0 stage last (on top) -->
    <div id="A2" class="lay"><div class="st ta" id="sA2"><img class="ta" src="assets/tv_n.png" alt="" /><img class="ta" id="dayA" src="assets/tv.png" alt="" /></div></div>
    <div id="LN" class="lay"><div class="st tn" id="sN"><img class="tn" src="assets/niche5_n.png" alt="" /></div></div>
    <div id="LR" class="lay"><div class="st tr" id="sR"><img class="tr" src="assets/room.png" alt="" /><img class="tr" id="nR" src="assets/room_n.png" alt="" /></div></div>
    <div id="LA" class="lay"><div class="st ta" id="sA"><img class="ta" src="assets/tv.png" alt="" /></div></div>
  </div>
  <div id="txt" class="clip" data-start="0" data-duration="20" data-track-index="1" style="position:absolute;inset:0">
    <div id="t1" class="t"><div class="ln"><span>קיר</span> <span>טלוויזיה?</span></div><div class="ln"><span>זה</span> <span>רק</span> <span>ההתחלה.</span></div></div>
    <div id="t2" class="t"><div class="ln"><span>כל</span> <span>החלל</span></div><div class="ln"><span>בתכנון</span> <span>אחד.</span></div></div>
    <div id="t3" class="t"><div class="ln"><span>האור</span></div><div class="ln"><span>חלק</span> <span>מהנגרות.</span></div></div>
    <div id="t4" class="t"><div class="ln"><span>דברו</span> <span>איתנו</span></div><div class="ln"><span>בוואטסאפ</span></div></div>
    <div id="end"><div id="endglow"></div><div id="endin"><img src="assets/logo_light.png" alt="אבן ועץ" /><div class="l1">ייעוץ והדמיה<br /><em>ללא עלות.</em></div><div class="l2">נגרות בהתאמה אישית</div></div></div>
  </div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const K = RK.kit(tl);
gsap.set(["#LN", "#A2"], { opacity: 0 });
gsap.set(".lay", { transformOrigin: "540px 960px" });

// beat punch on a layer (small, fast, returns): energy without a cut
const punch = (sel, t, s = 1.035) => {
  tl.fromTo(sel, { scale: 1 }, { scale: s, duration: 0.09, ease: "power2.out", immediateRender: false }, t);
  tl.to(sel, { scale: 1, duration: 0.3, ease: "power2.inOut" }, t + 0.09);
};
// A 0-2.3: frame 0 = the whole TV wall, already pushing; ramps into a fast pan left to the LED slats
K.path("#sA", [[0, 900, 1500, 0.72], [2.5, 872, 1600, 0.62]]);
K.card("#t1", 0.15, 1.7);
// v4 (her note 13.10: the jump at 2-3 s felt like a bug): matched pull-back instead of the whip. The TV in the room
// photo is placed at the same screen position and size as the TV-wall photo (TV measured in both, x1.585) and the
// two dissolve while the camera keeps pulling back — one continuous move from the TV wall out to the whole room.
K.dissolve("#LA", "#LR", 2.12, 0.32);
// a light motion blur at the mid-point hides the different camera angle of the two photos (vent / slats would double)
tl.fromTo("#LA", { filter: "blur(0px)" }, { filter: "blur(6px)", duration: 0.2, ease: "sine.in", immediateRender: false }, 2.06);
tl.fromTo("#LR", { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 0.24, ease: "sine.out", immediateRender: false }, 2.28);
// R 2.3-7.15: lands moving, pulls out to both walls; evening rises from the floor; ramps into the niche
K.path("#sR", [[2.1, 998, 1383, 1.008], [2.5, 985, 1393, 0.983], [3.4, 850, 1405, 0.80], [4.6, 768, 1382, 0.722], [5.6, 766, 1372, 0.74], [6.6, 640, 1355, 0.87], [7.15, 430, 1342, 1.3]]);
K.card("#t2", 2.6, 4.2);
punch("#LR", 3.27);
K.card("#t3", 4.4, 5.45);
K.maskFill("#nR", 5.0, 1.4, { dir: "to top", soft: 30, ease: "sine.inOut" });
// dive through the niche into the niche wall
K.blurOut("#LR", 7.15, 16, 0.3);
K.swap("#LR", "#LN", 7.15);
K.blurIn("#LN", 7.15, 16, 0.3);
// N 7.15-12.7: lands on the lit niche, pulls out to the whole wall (light moment, 2 s), speed-ramps up to the top
// of the lit vitrine and DESCENDS along its shelves (her note 13.10: the descending camera she loved), down to the floor
K.path("#sN", [[7.15, 860, 1620, 0.75], [7.8, 935, 1640, 0.61], [8.8, 945, 1615, 0.62], [9.35, 1020, 1470, 0.71],
               [10.25, 1318, 1000, 1.0], [11.45, 1326, 1700, 1.0], [12.7, 1330, 2380, 1.0]]);
// motion dissolve into the TV wall at evening, still descending; the room lights come back top→down with the camera
K.dissolve("#LN", "#A2", 12.35, 0.34);
K.path("#sA2", [[12.3, 760, 1290, 0.76], [13.6, 785, 1400, 0.72], [16.9, 800, 1450, 0.70]]);
K.maskFill("#dayA", 13.6, 1.1, { dir: "to bottom", soft: 30, ease: "sine.inOut" });
K.card("#t4", 14.8, 16.6);
punch("#A2", 14.8, 1.025);
K.endCard(16.9, 3.1);
K.done(20);
</script>
</body>
</html>
