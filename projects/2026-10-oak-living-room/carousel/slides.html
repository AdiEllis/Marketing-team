<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<!-- Oak living room post v2 (13.10): slide 3 rebuilt after her note ("סתם מילים... אין פה מקצועיות"; oak crop "כאילו בטעות"):
     named details + one professional line each (docs/research/2026-10-detail-callouts.md), crops composed on purpose.
     v1 (13.10). "הפוסט הזה מראה ש..." in a well-planned living room every wall continues the one
     before it: the same oak, the same light, the same lines. Typography = option ג she chose (Plex Regular, small,
     charcoal + caramel-gold, aligned to the work, thin gold rule). Logo small at the bottom of every photo (P11א).
     Photos: her originals cleaned + x2 (work/hq); no grade (dE>2 on the oak, P15). -->
<style>
@font-face{font-family:"Plex";src:url(plex-Regular.ttf);font-weight:400}
@font-face{font-family:"Plex";src:url(plex-Medium.ttf);font-weight:500}
:root{--ink:#2b2926;--gold:#9a6a32;--cream:#efe6da;--gold-l:#d8b878}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:#d9d0c6}
.full{position:absolute;inset:0;width:1080px;height:1350px}
.h{position:absolute;direction:rtl;text-align:right;font:400 64px/1.18 "Plex";color:var(--ink)}
.h span{display:block;color:var(--gold)}
.h i{display:block;width:90px;height:2px;background:var(--gold);margin:22px 0 0 auto}
.logo{position:absolute;right:48px;bottom:56px;width:84px}
/* dictionary slide: oak-tone field, three real details, one word each */
.dict{background:linear-gradient(180deg,#d6c4aa 0%,#cbb497 100%)}
/* .k unused */ .dict .k{position:absolute;direction:rtl;right:60px;top:110px;font:400 40px/1.3 "Plex";color:var(--ink);letter-spacing:.01em}
.dict .k i{display:block;width:70px;height:2px;background:var(--gold);margin:18px 0 0 auto}
.d{position:absolute;direction:rtl;text-align:right}
.d img{display:block;width:100%;box-shadow:0 14px 34px rgba(60,40,20,.16)}
.d figcaption{margin-top:16px;font:400 25px/1.4 "Plex";color:var(--ink)}
.d b{display:block;font:500 31px/1.2 "Plex";color:var(--gold);margin-bottom:5px}
.end{background:radial-gradient(110% 80% at 50% 45%,#3b2617 0%,#1f140c 75%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.end .glow{position:absolute;left:165px;top:300px;width:750px;height:750px;border-radius:50%;background:radial-gradient(circle,rgba(216,170,100,.32) 0%,rgba(216,170,100,.12) 40%,rgba(216,170,100,0) 70%)}
.end .lg{position:relative;width:340px}
.end .line{position:relative;direction:rtl;text-align:center;margin-top:64px;font:400 52px/1.2 "Plex";color:var(--cream);letter-spacing:.01em}
.end .rule{position:relative;width:90px;height:2px;background:var(--gold-l);margin-top:26px}
</style>
</head>
<body>
<section class="slide" id="s1">
  <img class="full" src="p1.png" alt="" />
  <div class="h" style="right:84px;top:86px">שני קירות,<span>שפה אחת.</span><i></i></div>
  <img class="logo" src="logo_alpha.png" alt="אבן ועץ" />
</section>
<section class="slide" id="s2">
  <img class="full" src="p2.png" alt="" />
  <div class="h" style="right:110px;top:44px;font-size:48px">הקווים ממשיכים<span>גם מתחת למזנון.</span><i style="margin-top:16px"></i></div>
  <img class="logo" src="logo_alpha.png" alt="אבן ועץ" />
</section>
<section class="slide dict" id="s3">
  <div class="h" style="right:60px;top:36px;font-size:48px">שלושה פרטים,<span>סלון אחד.</span><i style="margin-top:14px"></i></div>
  <figure class="d" style="right:60px;top:206px;width:960px"><img src="d_console.png" style="height:300px" alt="" /><figcaption><b>מזנון צף</b>תלוי על הקיר, והחריצים בחיפוי ממשיכים בקו אחד מעליו ומתחתיו.</figcaption></figure>
  <figure class="d" style="right:60px;top:616px;width:465px"><img src="d_niche.png" style="height:440px" alt="" /><figcaption><b>נישה מוארת</b>תאורה חמה משולבת בתוך הנישה ומאירה את מה שמוצג בה, בלי מנורה גלויה.</figcaption></figure>
  <figure class="d" style="right:555px;top:616px;width:465px"><img src="d_slats.png" style="height:440px" alt="" /><figcaption><b>עמוד פסים מואר</b>חיפוי פסים עם שני פסי לד, בדיוק בנקודה שבה קיר הטלוויזיה פוגש את קיר הנישה.</figcaption></figure>
  <img class="logo" src="logo_alpha.png" alt="אבן ועץ" style="right:505px;bottom:18px;width:70px" />
</section>
<section class="slide" id="s4">
  <img class="full" src="p4.png" alt="" />
  <img class="logo" src="logo_alpha.png" alt="אבן ועץ" />
</section>
<section class="slide end" id="s5">
  <div class="glow"></div>
  <img class="lg" src="logo_light.png" alt="אבן ועץ" />
  <div class="rule"></div>
  <div class="line">תכנון אישי לכל חלל</div>
</section>
</body>
</html>
