<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<!-- Warm-light wall reel v1 — "מקצה לקצה." / "ביום, נקי." / "בערב, חם."
     Beat grid 105 bpm (0.5714 s). One camera that never stops.
     A 0–2.86   frame 0 = the whole frontal wall, already panning end to end (right -> left)
     B 2.86–    motion dissolve to the angled view (day). Card "ביום, נקי." sits ON the plain panels (inside the stage)
     SIGNATURE 4.57–6.29 "sunset on the wall": the REAL warm photo of the same wall (aligned, SIFT) is revealed behind a
                light front that travels the length of the sideboard, right -> left; the real LEDs flare as it passes
                (bloom of the photo's own bright pixels, masked to the front). Card turns to "בערב, חם." in gold.
     C          the same camera keeps pushing into the lit library and tilts up its shelves
     10.29      the library's light flares -> cut at the peak -> D the low close-up along the sideboard, landing in motion
     E 13.71–   dissolve to the warm wall; the logo + "נגרות בהתאמה אישית" settle on the dark TV screen. -->
<style>
@font-face{font-family:"Heebo";src:url(assets/heebo.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1c1816}
#root{width:100%;height:100%;position:relative;overflow:hidden;background:#1c1816}
.lay{position:absolute;inset:0;overflow:hidden}
.st{position:absolute;left:0;top:0;width:1179px;height:1472px;transform-origin:0 0}
.st > img{position:absolute;left:0;top:0;display:block;width:1179px;height:1472px}
.st > img.bl{mix-blend-mode:screen;opacity:0}
.fx{position:absolute;pointer-events:none;mix-blend-mode:screen;opacity:0}
.t{position:absolute;direction:rtl;font-family:"Heebo";font-weight:850;line-height:1.02;letter-spacing:-.01em;white-space:nowrap}
.t .ln{display:block;overflow:hidden;padding:0 6px 10px}
.t span{display:inline-block}
#t1{left:0;width:1080px;top:610px;text-align:center;font-size:100px;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.55)}
#t1 em{font-style:normal;color:#f0c987}
.pc{left:345px;width:220px;text-align:center;top:470px;font-size:60px}
#t2{color:#1f1813}
#t3{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35)}
#t3 em{font-style:normal;color:#f0c987}
#sign{position:absolute;left:662px;top:500px;width:240px;text-align:center;direction:rtl}
#sign img{width:132px;display:block;margin:0 auto}
#sign div{margin-top:22px;font-family:"Heebo";font-weight:600;font-size:27px;line-height:1.2;color:#efe3cf;letter-spacing:.01em}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="17.71" data-width="1080" data-height="1920">

  <div id="scene" class="clip" data-start="0" data-duration="17.71" data-track-index="0" style="position:absolute;inset:0">
    <div id="LD" class="lay"><div class="st" id="sD"><img src="assets/detail.png" alt="" /><img class="bl" id="bD" src="assets/detail_bloom.jpg" alt="" /></div></div>
    <div id="LA" class="lay"><div class="st" id="sA"><img src="assets/front.png" alt="" /></div></div>
    <div id="LB" class="lay"><div class="st" id="sB">
      <img src="assets/day.png" alt="" />
      <img id="warm" src="assets/warm.png" alt="" />
      <img class="bl" id="bW" src="assets/warm_bloom.jpg" alt="" />
      <div class="fx" id="col" style="left:0;top:0;width:160px;height:1472px;background:linear-gradient(90deg,rgba(255,214,150,0) 0%,rgba(255,214,150,.28) 50%,rgba(255,214,150,0) 100%)"></div>
      <div class="fx" id="head" style="left:0;top:0;width:520px;height:90px;border-radius:50%;transform-origin:50% 50%;background:radial-gradient(closest-side,rgba(255,236,196,1) 0%,rgba(255,206,140,.55) 40%,rgba(255,190,110,0) 100%)"></div>
      <div id="t2" class="t pc"><div class="ln"><span>ביום,</span></div><div class="ln"><span>נקי.</span></div></div>
      <div id="t3" class="t pc"><div class="ln"><span>בערב,</span></div><div class="ln"><span><em>חם.</em></span></div></div>
    </div></div>
    <div id="LE" class="lay"><div class="st" id="sE">
      <img src="assets/warm.png" alt="" />
      <img class="bl" id="bE" src="assets/warm_bloom.jpg" alt="" />
      <div id="sign"><img src="assets/logo_light.png" alt="אבן ועץ" /><div>נגרות<br />בהתאמה אישית</div></div>
    </div></div>
    <div id="wl" style="position:absolute;left:-260px;top:0;width:1600px;height:80px;transform-origin:50% 50%;opacity:0;rotate:16.05deg;mix-blend-mode:screen;background:linear-gradient(180deg,rgba(255,220,160,0) 0%,rgba(255,226,175,.55) 42%,#fff6e4 50%,rgba(255,226,175,.55) 58%,rgba(255,220,160,0) 100%)"></div>
  <div id="flash" style="position:absolute;inset:0;background:radial-gradient(70% 55% at 30% 45%,rgba(255,232,190,1) 0%,rgba(255,214,160,.85) 45%,rgba(255,206,150,.55) 100%);mix-blend-mode:screen;opacity:0"></div>
  </div>

  <div id="txt" class="clip" data-start="0" data-duration="17.71" data-track-index="1" style="position:absolute;inset:0">
    <div id="t1" class="t"><div class="ln"><span>מקצה</span> <span><em>לקצה.</em></span></div></div>
  </div>
</div>

<script>
const tl = gsap.timeline({ paused: true });
const B = 60 / 105;                                   // one beat
const v = (cx, cy, s) => ({ scale: s, x: 540 - cx * s, y: 960 - cy * s });
const $ = id => document.getElementById(id);
gsap.set(".t span", { yPercent: 115 });
gsap.set(["#LA", "#LB", "#LE"], { opacity: 0 });

const card = (sel, at, out) => {
  tl.fromTo(sel + " span", { yPercent: 115 }, { yPercent: 0, duration: 0.45, stagger: 0.08, ease: "power3.out", immediateRender: false }, at);
  if (out) tl.to(sel + " span", { yPercent: -115, duration: 0.3, stagger: 0.04, ease: "power2.in" }, out);
};

// one camera path per stage: Catmull-Rom through keyframes (time, cx, cy, s) -> continuous velocity, no stop-go
function path(el, keys) {
  const P = { t: keys[0][0] };
  const at = t => {
    let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
    const k0 = keys[Math.max(i - 1, 0)], k1 = keys[i], k2 = keys[i + 1], k3 = keys[Math.min(i + 2, keys.length - 1)];
    const u = Math.min(1, Math.max(0, (t - k1[0]) / (k2[0] - k1[0])));
    const cr = j => { // non-uniform-time Catmull-Rom tangents
      const m1 = (k2[j] - k0[j]) / (k2[0] - k0[0] || 1) * (k2[0] - k1[0]);
      const m2 = (k3[j] - k1[j]) / (k3[0] - k1[0] || 1) * (k2[0] - k1[0]);
      const u2 = u * u, u3 = u2 * u;
      return (2 * u3 - 3 * u2 + 1) * k1[j] + (u3 - 2 * u2 + u) * m1 + (-2 * u3 + 3 * u2) * k2[j] + (u3 - u2) * m2;
    };
    return v(cr(1), cr(2), cr(3));
  };
  gsap.set(el, at(keys[0][0]));
  tl.fromTo(P, { t: keys[0][0] }, { t: keys[keys.length - 1][0], duration: keys[keys.length - 1][0] - keys[0][0], ease: "none",
    immediateRender: false, onUpdate: () => gsap.set(el, at(P.t)) }, keys[0][0]);
}

// D 0–2.86  frame 0: the low close-up along the sideboard, already gliding toward its far end: "מקצה לקצה."
path("#sD", [[0, 400, 784, 1.42], [3.3, 560, 752, 1.48]]);
gsap.set("#bD", { opacity: 0.35 });
tl.to("#bD", { opacity: 0.75, duration: 1.4, ease: "sine.inOut" }, 0.4);
card("#t1", 0.15, 2.2);

// D -> A  a line of light parallel to the real LED strip sweeps down the frame and reveals the whole wall above it
const WP = { o: -360 }, K = 0.2876 * 1080;              // slope of the LED strip on screen (detail photo)
const wipe = () => { const o = WP.o;
  $("LA").style.clipPath = `polygon(0px 0px, 1080px 0px, 1080px ${o + K}px, 0px ${o}px)`;
  gsap.set("#wl", { y: o + K / 2 - 40 }); };
wipe();
tl.to("#bD", { opacity: 1, duration: 0.35, ease: "power2.in" }, 5 * B - 0.55);
tl.set("#LA", { opacity: 1 }, 5 * B - 0.4);
tl.to(WP, { o: 1940, duration: 0.85, ease: "power1.inOut", onUpdate: wipe }, 5 * B - 0.4);
tl.fromTo("#wl", { opacity: 0 }, { opacity: 1, duration: 0.15, immediateRender: false }, 5 * B - 0.4);
tl.to("#wl", { opacity: 0, duration: 0.2 }, 5 * B + 0.3);
tl.set("#LD", { opacity: 0 }, 5 * B + 0.46);

// A 2.46–6.2  the whole frontal wall, panning toward the library end (no text: the wall speaks)
path("#sA", [[5 * B - 0.4, 600, 736, 1.32], [10 * B + 0.46, 420, 742, 1.39]]);

// B/C 5.71–13.71  the angled wall: drift, the sunset, then push into the library and tilt up its shelves
path("#sB", [[10 * B, 476, 738, 1.34], [8.0, 452, 740, 1.38], [10.9, 425, 745, 1.43], [11.9, 384, 785, 1.51],
             [12.8, 334, 860, 1.65], [24 * B, 316, 650, 1.75]]);
tl.fromTo("#LB", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "sine.inOut", immediateRender: false }, 10 * B);
tl.set("#LA", { opacity: 0 }, 10 * B + 0.46);
card("#t2", 11 * B, 7.6);

// SIGNATURE 8.0–10.29: the light front runs the length of the sideboard, the warm wall appears behind it
const cove = x => 1190 - 0.32 * (x - 140);           // middle of the sideboard's lit back panel (LSD lines, through the wall's VP)
const SW = { p: 960 };
const warmEl = $("warm"), bW = $("bW"), col = $("col"), head = $("head");
const setMask = (el, css) => { el.style.webkitMaskImage = css; el.style.maskImage = css; };
const sweep = () => {
  const p = SW.p;
  setMask(warmEl, `linear-gradient(90deg, rgba(0,0,0,0) ${p - 70}px, #000 ${p + 110}px)`);
  setMask(bW, `linear-gradient(90deg, rgba(0,0,0,0) ${p - 150}px, #000 ${p}px, rgba(0,0,0,.35) ${p + 240}px, rgba(0,0,0,.35) 100%)`);
  gsap.set(col, { x: p - 80 }); gsap.set(head, { x: p - 260, y: cove(p) - 45, rotation: -17.7 });
};
sweep();
gsap.set(bW, { opacity: 0 });
const S0 = 14 * B, S1 = 18 * B;
tl.to(SW, { p: -160, duration: S1 - S0, ease: "power1.inOut", onUpdate: sweep }, S0);
tl.fromTo([col, head], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "sine.out", immediateRender: false }, S0);
tl.to(col, { opacity: 0, duration: 0.35, ease: "sine.in" }, S1 - 0.3);
tl.to(head, { opacity: 0, duration: 0.45, ease: "sine.in" }, S1 - 0.25);
tl.fromTo(bW, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "sine.out", immediateRender: false }, S0);
tl.to(bW, { opacity: 0.45, duration: 0.9, ease: "sine.inOut" }, S1);
card("#t3", S1 - 0.1, 11.9);

// C -> E  the library's own light flares; cut at the peak to the warm wall; logo + line settle on the dark screen
tl.to(bW, { opacity: 1, duration: 0.75, ease: "power2.in" }, 24 * B - 0.75);
tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.85, duration: 0.3, ease: "power2.in", immediateRender: false }, 24 * B - 0.3);
tl.set("#LE", { opacity: 1 }, 24 * B);
tl.set("#LB", { opacity: 0 }, 24 * B);
tl.to("#flash", { opacity: 0, duration: 0.6, ease: "power2.out" }, 24 * B);
path("#sE", [[24 * B, 560, 768, 1.40], [25.2 * B, 600, 761, 1.355], [31 * B, 640, 742, 1.335]]);
gsap.set("#bE", { opacity: 0.9 });
tl.to("#bE", { opacity: 0.35, duration: 1.0, ease: "sine.out" }, 24 * B);
tl.to("#bE", { opacity: 0.6, duration: 1.6, ease: "sine.inOut" }, 24 * B + 1.1);
gsap.set(["#sign img", "#sign div"], { opacity: 0 });
tl.fromTo("#sign img", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 25 * B + 0.2);
tl.fromTo("#sign div", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, 25 * B + 0.55);
tl.set({}, {}, 31 * B);

window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body>
</html>
