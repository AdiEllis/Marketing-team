<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<!-- Post v2 (post-designer v3): three different archetypes in one carousel, same brand DNA.
     S1 split off/on (real aligned pair) · S2 detail callouts with hairline leaders · S3 editorial frame on the brand dark. -->
<style>
@font-face{font-family:"Heebo";src:url(heebo.ttf);font-weight:100 900}
@font-face{font-family:"Frank";src:url(frank.ttf);font-weight:300 900}
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1f1a17;--bronze:#a8763e;--gold:#d8b878;--dark:#1c1816;--paper:#f4eee6}
body{width:1080px;font-family:"Heebo"}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--dark)}
.abs{position:absolute}
.rtl{direction:rtl;text-align:right}
.folio{position:absolute;top:58px;left:64px;font:500 26px "Heebo";letter-spacing:.12em;color:rgba(255,255,255,.85)}
.folio.d{color:rgba(31,26,23,.7)}

/* S1 split */
#s1 img.ph{position:absolute;inset:0;width:1080px;height:1350px}
#s1 .on{clip-path:inset(0 0 0 866px)}
#s1 .line{position:absolute;left:865px;top:0;width:2px;height:1350px;background:var(--gold);box-shadow:0 0 18px rgba(216,184,120,.6)}
#s1 .tag{position:absolute;top:1060px;font:600 28px "Heebo";letter-spacing:.14em;color:#fff;padding:10px 18px;background:rgba(28,24,22,.55);border-radius:2px}
#s1 .ttl{position:absolute;right:236px;top:104px;width:720px;font:700 80px/1.08 "Frank";color:var(--ink)}
#s1 .ttl em{font-style:normal;color:var(--bronze)}
#s1 .shade{position:absolute;left:0;right:0;top:0;height:380px;background:linear-gradient(180deg,rgba(246,242,236,.85),rgba(246,242,236,0))}
#s1 .logo{position:absolute;left:56px;bottom:52px;width:140px}

/* S2 callouts */
#s2 img.photo{position:absolute;inset:0;width:1080px;height:1350px}
#s2 svg{position:absolute;inset:0}
.lab{position:absolute;direction:rtl;font:600 34px "Heebo";color:var(--ink);background:rgba(250,247,242,.88);padding:10px 20px 12px;border-right:4px solid var(--bronze)}
#s2 .ttl{position:absolute;right:64px;top:56px;font:800 64px "Heebo";color:var(--ink);direction:rtl}

/* S3 editorial frame */
#s3 .pic{position:absolute;left:60px;top:60px;width:960px;height:1000px}
#s3 .ttl{position:absolute;right:64px;top:1086px;font:700 82px/1 "Frank";color:var(--paper);direction:rtl}
#s3 .sub{position:absolute;right:64px;top:1186px;display:flex;align-items:center;gap:18px;font:400 34px "Heebo";color:#d9cfc3;direction:rtl}
#s3 .sub i{display:block;width:56px;height:2px;background:var(--gold)}
#s3 .logo{position:absolute;left:60px;bottom:46px;width:132px}
#s3 .cta{position:absolute;right:64px;bottom:34px;height:72px;padding:0 34px;border-radius:36px;display:flex;align-items:center;font:700 30px "Heebo";color:#1c1714;background:linear-gradient(180deg,#d9b97c,#b98c4f)}
#s3 .folio{top:20px;left:auto;right:64px;font-size:22px;color:rgba(244,238,230,.5)}
</style>
</head>
<body>

<section class="slide" id="s1">
  <img class="ph" src="unlit.png" alt="" />
  <img class="ph on" src="lit.png" alt="" />
  <div class="shade"></div>
  <div class="line"></div>
  <div class="tag" style="left:676px">כבוי</div>
  <div class="tag" style="left:890px">דולק</div>
  <div class="ttl rtl">כבוי, שקט ונקי.<br /><em>דולק, חם ומואר.</em></div>
  <img class="logo" src="logo_light.png" alt="אבן ועץ" />
</section>

<section class="slide" id="s2">
  <img class="photo" src="front.png" alt="" />
  <svg width="1080" height="1350" viewBox="0 0 1080 1350">
    <g stroke="#a8763e" stroke-width="2" fill="none">
      <path d="M533 684 L533 560 L470 560" />
      <path d="M765 406 L765 300 L700 300" />
      <path d="M898 1101 L898 1190 L830 1190" />
    </g>
    <g fill="#a8763e"><circle cx="533" cy="684" r="9" /><circle cx="765" cy="406" r="9" /><circle cx="898" cy="1101" r="9" /></g>
  </svg>
  <div class="lab" style="right:610px;top:531px">פס LED מעל המסך</div>
  <div class="lab" style="right:380px;top:271px">חזיתות בלי ידיות</div>
  <div class="lab" style="right:250px;top:1161px">נישה במידה מדויקת</div>
  <div class="ttl">מקרוב.</div>
</section>

<section class="slide" id="s3">
  <img class="pic" src="open.png" alt="" />
  <div class="ttl">מאחורי החזית.</div>
  <div class="sub"><span>פתרונות אחסון נסתרים בתוך הקיר</span><i></i></div>
  <img class="logo" src="logo_light.png" alt="אבן ועץ" />
  <div class="cta">דברו איתנו בוואטסאפ</div>
</section>

</body>
</html>
