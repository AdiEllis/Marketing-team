<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<!-- Reel v2 "לבן. שחור. ואור." — signature: the wall assembles from its real front panels (slices on the real joints),
     portal through the black screen, the vitrine fills with light (real unlit/lit pair, rising mask),
     door-fold to the hidden shelves, detail burst, hard stop on the hero. ~13 words on screen. -->
<style>
@font-face{font-family:"Heebo";src:url(assets/heebo.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1c1816}
#root{width:100%;height:100%;position:relative;overflow:hidden;background:#1c1816}
.lay{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.st{position:absolute;left:0;top:0;width:1178px}
.st img{display:block;width:1178px}
#wO,#wU,#wL,#wF,.dump{opacity:0}
#wL{-webkit-mask-image:linear-gradient(to top,#000 -20%,transparent -5%);mask-image:linear-gradient(to top,#000 -20%,transparent -5%)}

.t{position:absolute;direction:rtl;text-align:right;font-family:"Heebo";font-weight:900;letter-spacing:-.02em;line-height:1}
.t .ln{display:block;overflow:hidden;padding:0 6px 14px}
.t span{display:inline-block}
.ink{color:#1f1a17}
.gold{color:#a8763e}
.wht{color:#fff}
#sweep{position:absolute;top:-400px;left:0;width:520px;height:2800px;background:linear-gradient(90deg,rgba(255,250,240,0) 0%,rgba(255,250,240,.55) 50%,rgba(255,250,240,0) 100%);mix-blend-mode:screen;opacity:0;transform:rotate(18deg)}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#blk{position:absolute;inset:0;background:#000;opacity:0}
#mark{position:absolute;left:64px;top:1410px;width:140px;opacity:0}
#curtain{position:absolute;inset:0;background:#1c1816}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;direction:rtl;opacity:0}
#end .logo{width:300px}
#end .rule{width:110px;height:3px;background:#d8b878;margin:58px 0 40px}
#end .l1{font-family:"Heebo";font-weight:800;font-size:62px;line-height:1.15;color:#f4eee6;text-align:center}
#end .pill{margin-top:60px;height:96px;padding:0 50px;border-radius:48px;display:flex;align-items:center;font-family:"Heebo";font-weight:700;font-size:40px;color:#1c1714;background:linear-gradient(180deg,#d9b97c,#b98c4f)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">

  <div id="scene" class="clip" data-start="0" data-duration="16" data-track-index="0" style="position:absolute;inset:0;perspective:1600px">
    <div id="wO" class="lay"><div id="sO" class="st"><img src="assets/open.jpg" alt="" /></div></div>
    <div id="wU" class="lay"><div id="sU" class="st"><img src="assets/unlit.png" alt="" /></div></div>
    <div id="wL" class="lay"><div id="sL" class="st"><img src="assets/lit.jpg" alt="" /></div></div>
    <div id="wF" class="lay"><div id="sF" class="st"><img src="assets/front.jpg" alt="" /></div></div>
    <!-- the wall assembling from its four real front panels (clip edges = real joints) -->
    <div id="k0" class="lay" style="clip-path:inset(0 754px 0 0)"><div class="st sk"><img src="assets/front.jpg" alt="" /></div></div>
    <div id="k1" class="lay" style="clip-path:inset(0 455px 0 325px)"><div class="st sk"><img src="assets/front.jpg" alt="" /></div></div>
    <div id="k2" class="lay" style="clip-path:inset(0 179px 0 624px)"><div class="st sk"><img src="assets/front.jpg" alt="" /></div></div>
    <div id="k3" class="lay" style="clip-path:inset(0 0 0 900px)"><div class="st sk"><img src="assets/front.jpg" alt="" /></div></div>
    <!-- detail burst -->
    <div id="d1" class="lay dump"><div class="st"><img src="assets/front.jpg" alt="" /></div></div>
    <div id="d2" class="lay dump"><div class="st"><img src="assets/lit.jpg" alt="" /></div></div>
    <div id="d3" class="lay dump"><div class="st"><img src="assets/lit.jpg" alt="" /></div></div>
    <div id="d4" class="lay dump"><div class="st"><img src="assets/open.jpg" alt="" /></div></div>
    <div id="d5" class="lay dump"><div class="st"><img src="assets/front.jpg" alt="" /></div></div>
    <div id="sweep"></div>
    <div id="blk"></div>
    <div id="flash"></div>
  </div>

  <div id="txt" class="clip" data-start="0" data-duration="16" data-track-index="1" style="position:absolute;inset:0">
    <div id="t1" class="t ink" style="right:72px;top:330px;font-size:250px"><div class="ln"><span>לבן.</span></div></div>
    <div id="t2" class="t wht" style="right:150px;top:880px;font-size:230px"><div class="ln"><span>שחור.</span></div></div>
    <div id="t3" class="t gold" style="right:560px;top:470px;font-size:250px"><div class="ln"><span>ואור.</span></div></div>
    <div id="t4" class="t wht" style="right:60px;top:1060px;font-size:130px;line-height:1.02"><div class="ln"><span>אחסון</span></div><div class="ln"><span>נסתר.</span></div></div>
    <div id="t5" class="t ink" style="right:330px;top:330px;font-size:120px;line-height:1.02"><div class="ln"><span>גימור</span></div><div class="ln"><span>מוקפד.</span></div></div>
    <img id="mark" src="assets/logo_light.png" alt="אבן ועץ" />
  </div>

  <div id="endwrap" class="clip" data-start="0" data-duration="16" data-track-index="2" style="position:absolute;inset:0">
    <div id="curtain"></div>
    <div id="end">
      <img class="logo" src="assets/logo_light.png" alt="אבן ועץ" />
      <div class="rule"></div>
      <div class="l1">קיר טלוויזיה מעוצב,<br />בהתאמה אישית.</div>
      <div class="pill">דברו איתנו בוואטסאפ</div>
    </div>
  </div>
</div>

<script>
const tl = gsap.timeline({ paused: true });
// all views keep the Instagram UI marks of the source screenshots out of frame and upscale <= ~1.75x
const H = { F: 1467, U: 1475, L: 1475, O: 1453 };
const view = (k, cx, cy, z) => { const s = (1920 / H[k]) * z; return { scale: s, x: 540 - cx * s, y: 960 - cy * s }; };
gsap.set(".st", { transformOrigin: "0 0" });
const showText = (sel, at, out) => {
  tl.fromTo(sel + " span", { yPercent: 110 }, { yPercent: 0, duration: 0.45, stagger: 0.08, ease: "power4.out" }, at);
  tl.to(sel + " span", { yPercent: -110, duration: 0.3, stagger: 0.05, ease: "power3.in" }, out);
};

// ── B1 0–1.2  HOOK: the wall assembles from its real front panels (motion from frame 0)
const F0 = view("F", 650, 733, 1.03);
gsap.set(["#sF", ".sk"], F0);
["#k0", "#k1", "#k2", "#k3"].forEach((k, i) => {
  tl.fromTo(k, { y: i % 2 ? 1300 : -1300 }, { y: 0, duration: 0.85, ease: "expo.out" }, i * 0.08);
});
tl.set("#wF", { opacity: 1 }, 1.2);
tl.set(["#k0", "#k1", "#k2", "#k3"], { opacity: 0 }, 1.2);
showText("#t1", 0.45, 1.45);
tl.fromTo("#mark", { opacity: 0 }, { opacity: 0.95, duration: 0.4 }, 0.6);
tl.to("#mark", { opacity: 0, duration: 0.25 }, 2.05);

// ── B2 1.2–2.3  punch toward the black screen
tl.fromTo("#sF", F0, { ...view("F", 560, 800, 1.18), duration: 0.35, ease: "power4.out", immediateRender: false }, 1.45);
showText("#t2", 1.6, 2.15);
// portal: dive into the black screen
tl.to("#sF", { ...view("F", 520, 840, 7), duration: 0.55, ease: "power3.in" }, 2.2);
tl.to("#blk", { opacity: 1, duration: 0.2 }, 2.55);

// ── B3 2.75–4.9  out of the dark: the vitrine fills with light (real unlit -> lit, rising mask)
tl.set(["#wU", "#wL"], { opacity: 1 }, 2.75);
tl.set("#wF", { opacity: 0 }, 2.75);
tl.fromTo(["#sU", "#sL"], view("U", 860, 720, 1.33), { ...view("U", 830, 760, 1.25), duration: 2.2, ease: "sine.out", immediateRender: false }, 2.75);
tl.to("#blk", { opacity: 0, duration: 0.35 }, 2.75);
const fill = { p: -20 };
const setMask = () => {
  const m = fill.p >= 118 ? "none" : `linear-gradient(to top,#000 ${fill.p}%,transparent ${fill.p + 15}%)`;
  const el = document.getElementById("wL");
  el.style.webkitMaskImage = m; el.style.maskImage = m;
};
tl.fromTo(fill, { p: -20 }, { p: 120, duration: 1.5, ease: "power2.inOut", onUpdate: setMask }, 3.2);
showText("#t3", 3.75, 4.75);

// ── B4 4.9–6.3  HERO hold (no text): pull back to the whole wall, a sheen crosses the glass
tl.to(["#sU", "#sL"], { ...view("L", 685, 775, 1.12), duration: 1.3, ease: "power2.inOut" }, 4.9);
tl.fromTo("#sweep", { x: -700, opacity: 0.0 }, { x: 1300, opacity: 0.0, duration: 0.9, ease: "power1.inOut",
  keyframes: { opacity: [0, 0.45, 0.45, 0] } }, 5.4);

// ── B5 6.3–7.0  the wall swings open like a door -> hidden shelves behind it
tl.set("#wO", { opacity: 1 }, 6.3);
tl.set("#wU", { opacity: 0 }, 6.3);
tl.fromTo("#sO", view("O", 640, 640, 1.18), { ...view("O", 610, 640, 1.2), duration: 0.8, ease: "power2.out", immediateRender: false }, 6.3);
tl.fromTo("#wL", { rotationY: 0, transformOrigin: "100% 50%" }, { rotationY: -100, duration: 0.7, ease: "power2.in", transformOrigin: "100% 50%" }, 6.3);
tl.fromTo("#wL", { filter: "brightness(1)" }, { filter: "brightness(0.55)", duration: 0.7, ease: "power2.in", immediateRender: false }, 6.3);
tl.set("#wL", { opacity: 0 }, 7.0);

// ── B6 7.0–9.8  speed-ramp tilt down the hidden shelves
tl.to("#sO", { ...view("O", 575, 660, 1.27), duration: 0.5, ease: "power4.out" }, 7.1);
tl.to("#sO", { ...view("O", 560, 720, 1.3), duration: 2.1, ease: "sine.inOut" }, 7.6);
showText("#t4", 7.5, 9.45);

// ── B7 9.8–11.1  detail burst (5 real crops, 0.26s each)
const dumps = [["#d1", "F", 330, 600], ["#d2", "L", 855, 700], ["#d3", "L", 560, 600], ["#d4", "O", 560, 700], ["#d5", "F", 860, 600]];
dumps.forEach(([id, k, cx, cy], i) => {
  const t = 9.8 + i * 0.26;
  tl.set(id + " .st", view(k, cx, cy, 1.36), 0);
  tl.set(id, { opacity: 1 }, t);
  tl.fromTo(id + " .st", view(k, cx, cy, 1.36), { ...view(k, cx, cy, 1.3), duration: 0.26, ease: "none", immediateRender: false }, t);
  tl.fromTo("#flash", { opacity: 0.35 }, { opacity: 0, duration: 0.12, immediateRender: false }, t);
  if (i > 0) tl.set(dumps[i - 1][0], { opacity: 0 }, t);
});
tl.set("#wO", { opacity: 0 }, 9.8);

// ── B8 11.1–13.2  hard stop on the whole wall, lit
tl.set("#wL", { opacity: 1, rotationY: 0, filter: "brightness(1)" }, 11.1);
tl.set("#d5", { opacity: 0 }, 11.1);
tl.fromTo("#sL", view("L", 685, 775, 1.2), { ...view("L", 685, 775, 1.12), duration: 0.5, ease: "power4.out", immediateRender: false }, 11.1);
tl.to("#sL", { ...view("L", 690, 770, 1.15), duration: 1.6, ease: "sine.inOut" }, 11.6);
showText("#t5", 11.35, 12.95);
tl.fromTo("#sweep", { x: -700, opacity: 0 }, { x: 1300, duration: 1.0, ease: "power1.inOut",
  keyframes: { opacity: [0, 0.35, 0.35, 0] }, immediateRender: false }, 11.9);

// ── B9 13.2–16  curtain in the brand dark, end card
tl.fromTo("#curtain", { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.45, ease: "power3.inOut", transformOrigin: "100% 50%" }, 13.2);
tl.to("#end", { opacity: 1, duration: 0.01 }, 13.65);
tl.fromTo("#end .logo", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 13.7);
tl.fromTo("#end .rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 14.0);
tl.fromTo("#end .l1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5 }, 14.15);
tl.fromTo("#end .pill", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5 }, 14.4);

window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body>
</html>
